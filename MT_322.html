*{box-sizing:border-box}

  background:var(--mist);color:var(--ink);border:2px solid transparent;border-radius:.7rem;padding:.75rem .85rem;min-height:3.4rem;font-weight:400;font-size:1rem}

.opt .l{display:grid;place-items:center;width:2.1rem;height:2.1rem;border-radius:.4rem;background:var(--paper);border:1.5px solid var(--line);font-weight:800;font-size:.9rem}
.opt .tag{font-size:.75rem;font-weight:700;white-space:nowrap}
.opt[aria-disabled="true"]{cursor:default}
.opt[aria-disabled="true"]:hover{border-color:transparent}
.opt.right{border-color:var(--ok);background:var(--ok-tint)}
.opt.right .l{background:var(--ok);border-color:var(--ok);color:var(--paper)}

.opt.wrong{border-color:var(--red);background:var(--red-tint)}
.opt.wrong .l{background:var(--red);border-color:var(--red);color:var(--on-accent)}
.opt.wrong .tag{color:var(--red-deep)}
.opt.dim{opacity:.55}

/* correction et citation */
.fb{margin:1rem 0 0;padding:.9rem 1rem;border-radius:.7rem;background:var(--mist);font-size:.95rem}
.fb strong{font-weight:800}
.fb.ok strong{color:var(--ok)}
.fb.ko strong{color:var(--red-deep)}
.cite{margin:.7rem 0 0;padding:.1rem 0 .1rem .75rem;border-left:3px solid var(--line)}
.cite figcaption{font-size:.74rem;font-weight:600;color:var(--grey);margin-bottom:.15rem}
.cite blockquote{margin:0;font-size:.86rem;font-style:italic}
.next{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin:1.2rem 0 0}
.score-live{font-size:.85rem;color:var(--grey);font-variant-numeric:tabular-nums}

/* synthèse */
.result{margin:1.6rem 0 1.4rem;padding:1.2rem 1.25rem;border-radius:.9rem;background:var(--panel);color:var(--on-panel)}
.result h2{margin:0;font-size:1rem;font-weight:600}
.result .score{font-size:3.4rem;font-weight:800;line-height:1;margin:.35rem 0 .2rem;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.result .score span{font-size:1.4rem;font-weight:600;color:var(--on-panel-soft)}
.result .meta{margin:0 0 .8rem;color:var(--on-panel-soft);font-size:.85rem;font-variant-numeric:tabular-nums}
.result .verdict{margin:0 0 1rem;font-size:.95rem}
.result .segs li{background:#5F5F5C}
.result .segs li.ok{background:#6CC495}
.result .segs li.ko{background:var(--red)}
.result .row button,.result .row .btn{font-size:.85rem}
.bychap{width:100%;border-collapse:collapse;margin:0 0 1.4rem;font-size:.9rem;font-variant-numeric:tabular-nums}
.bychap th,.bychap td{text-align:left;padding:.45rem .3rem;border-bottom:1px solid var(--line)}
.bychap td:last-child,.bychap th:last-child{text-align:right}
.recap{display:grid;gap:.5rem;margin:0 0 1.4rem;padding:0;list-style:none}
.recap details{background:var(--mist);border-radius:.7rem;padding:.7rem .9rem}
.recap summary{cursor:pointer;display:grid;grid-template-columns:1.6rem minmax(0,1fr);gap:.6rem;align-items:start;font-weight:600;font-size:.92rem}
.recap summary::-webkit-details-marker{display:none}
.mark{display:grid;place-items:center;width:1.6rem;height:1.6rem;border-radius:50%;font-size:.8rem;font-weight:800;color:var(--on-accent)}
.mark.ok{background:var(--ok);color:var(--paper)}
.mark.ko{background:var(--red)}
.recap .body{margin:.6rem 0 0 2.2rem;font-size:.9rem}
.recap .body p{margin:.2rem 0}
h3.sec{font-size:1rem;margin:0 0 .6rem}

/* accueil */
.home h1{font-size:2.2rem;line-height:1.05;margin:1.6rem 0 .4rem;font-weight:800}
.home .lead{color:var(--grey);margin:0 0 1rem}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list a{display:grid;grid-template-columns:3.2rem minmax(0,1fr) auto;align-items:center;gap:.8rem;padding:.9rem .2rem;border-bottom:1px solid var(--line);text-decoration:none}
.list a:hover .t{color:var(--accent)}
.list .d{font-size:2.6rem;font-weight:800;color:var(--accent);line-height:1}
.list .t{font-weight:800;font-size:1.15rem;display:block}
.list .s{color:var(--grey);font-size:.85rem}
.list .go{font-size:.78rem;font-weight:600;color:var(--grey);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.list .go b{display:block;color:var(--accent);font-size:.95rem}
.list .all .d{font-size:1.6rem}
.foot-actions{margin:1rem 0 0}

/* fenêtre QR code */
dialog.qr{border:0;border-radius:1rem;padding:0;width:min(34rem,calc(100vw - 2rem));max-height:calc(100dvh - 2rem);background:var(--paper);color:var(--ink)}
dialog.qr::backdrop{background:var(--veil)}
.qr-in{display:grid;gap:.9rem;padding:1.2rem;text-align:center}
.qr-in h2{margin:0;font-size:1.25rem;font-weight:800}
.qr-in p{margin:0;color:var(--grey);font-size:.9rem}
.qr-code{background:#FFFFFF;border-radius:.6rem;padding:.6rem;width:min(100%,62vmin);margin:0 auto}
.qr-code svg{display:block;width:100%;height:auto}
.qr-url{font-size:.85rem;font-weight:600;word-break:break-all;user-select:all}
.qr-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem}

/* correction enseignant */
.q{margin:0 0 1.6rem}
.q h2{display:grid;grid-template-columns:2rem minmax(0,1fr);gap:.7rem;margin:0 0 .75rem;font-size:1.05rem;line-height:1.35}
.q h2 .qchap{margin-bottom:.15rem}
.q .n{display:grid;place-items:center;width:2rem;height:2rem;border-radius:50%;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:.95rem}

footer{color:var(--grey);font-size:.75rem;padding-block:2rem calc(2rem + env(safe-area-inset-bottom, 0px))}
footer p{margin:.2rem 0}

@media (max-width:480px){
  .numeral{font-size:4.2rem}
  .hero h1{font-size:1.6rem}
  .qnum{font-size:2.3rem}
  .qtitle h2{font-size:1.12rem}
  .chain small{display:none}
  .parts a{font-size:.74rem;padding:.4rem .7rem .45rem}
  .part-panel{padding:.6rem .6rem .5rem}
  .chain{flex-wrap:wrap;gap:.4rem}
  .chain li{flex:1 1 30%}
  .chain li+li{margin-left:0}
  .chain a{font-size:.74rem;padding:.45rem .2rem}
  .tools button{font-size:.8rem;padding:.5rem .8rem}
  .hint{display:none}
}
@media (prefers-reduced-motion:no-preference){
  .opt{transition:border-color .15s,background-color .15s,opacity .15s}
  .fb,.result{animation:rise .3s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
</style>

<body>
<header>
  <div class="wrap">
    <div class="course"><span><b>Qualité industrielle</b> · MT_322 · hepia</span><a href="https://nicolas-derobert.github.io/appli-qualite/" target="_blank" rel="noopener">QualiTools</a></div>
    <nav aria-label="Parties du cours"><ul class="parts" id="parts"></ul></nav>
    <div class="part-panel">
      <nav aria-label="Chapitres de la partie"><ul class="chain" id="chain"></ul></nav>
    </div>
  </div>
</header>
<main class="wrap" id="app" tabindex="-1"></main>
<div class="vh" id="live" aria-live="polite"></div>
<footer class="wrap">
  <p>Les citations et les numéros de page renvoient au support de cours Qualité_Industrielle_hepia_cours 2026-2027 (version VII).</p>
</footer>

<dialog class="qr" id="qrDialog" aria-labelledby="qrTitle">
  <div class="qr-in">
    <h2 id="qrTitle"></h2>
    <p>Scannez le code avec votre téléphone pour ouvrir le quiz.</p>
    <div class="qr-code" id="qrCode"></div>
    <div class="qr-url" id="qrUrl"></div>
    <div class="qr-actions">
      <button type="button" class="outline" id="qrCopy">Copier le lien</button>
      <button type="button" class="primary" id="qrClose">Fermer</button>
    </div>
  </div>
</dialog>

<script>
"use strict";
const L = "ABCD";
const NB = String.fromCharCode(160); // espace insécable
const STORE_KEY = "mt322-quiz-v5"; // même clé que les versions précédentes : les résultats sont conservés
const ICON_QR = '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm11-2h2v2h-2v-2zm-3 0h2v3h-2v-3zm5 3h3v2h-3v-2zm-5 2h3v3h-3v-3zm5 2h3v1h-3v-1zm1-7h2v3h-2v-3z"/></svg>';
const ICON_STAR = '<svg class="star" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1.8l3.1 6.6 7.2.9-5.3 5 1.4 7.1L12 17.9l-6.4 3.5L7 14.3l-5.3-5 7.2-.9z"/></svg>';

/* ---------- préparation des données (ne pas modifier) ---------- */
function typo(s){
  return String(s).replace(/ ([:;?!%])/g, NB + "$1").replace(/« /g, "«" + NB).replace(/ »/g, NB + "»").replace(/(\d) (\d{3})\b/g, "$1" + NB + "$2");
}
function prep(q, i, ch, where){
  q.ch = ch; q.i = i;
  q.q = typo(q.question); q.o = q.choix.map(typo); q.a = L.indexOf(String(q.reponse).trim().toUpperCase());
  q.e = typo(q.explication); q.p = q.page; q.c = q.citation ? typo(q.citation) : "";
  if (q.a < 0 || q.a >= q.o.length) console.error(where + ", question " + (i + 1) + " : réponse invalide (" + q.reponse + ").");
}
const CHAPS = Object.keys(QUIZ).map(Number);
for (const ch of CHAPS){
  QUIZ[ch].sujet = typo(QUIZ[ch].sujet);
  QUIZ[ch].questions.forEach((q, i) => prep(q, i, ch, "Chapitre " + ch));
}
const PIDS = Object.keys(PARTIES).map(Number).sort((a, b) => a - b);
for (const pid of PIDS){
  const P = PARTIES[pid];
  P.id = pid;
  P.chaps = P.chapitres.map(Number).filter(ch => QUIZ[ch]);
  P.all = pid === PIDS[0] ? "tout" : "tout-" + pid;
  const B = typeof BONUS === "object" ? BONUS[pid] : null;
  P.bonus = B && B.questions && B.questions.length ? (pid === PIDS[0] ? "bonus" : "bonus-" + pid) : null;
  if (P.bonus){
    B.sujet = typo(B.sujet);
    B.questions.forEach((q, i) => { prep(q, i, Number(q.chapitre), "Bonus partie " + P.numero); q.bonus = true; });
    B.chaps = [...new Set(B.questions.map(q => q.ch))].sort((a, b) => a - b);
  }
  P.sequence = P.bonus ? [...P.chaps, P.bonus] : P.chaps.slice();
}
CHAPS.filter(ch => !PIDS.some(pid => PARTIES[pid].chaps.includes(ch)))
  .forEach(ch => console.error("Chapitre " + ch + " : à rattacher à une partie dans PARTIES."));

/* ---------- clés : 3 (chapitre), tout, bonus ; partie suivante : tout-2, bonus-2 ---------- */
function partOf(key){
  if (typeof key === "number") return PIDS.find(pid => PARTIES[pid].chaps.includes(key)) || PIDS[0];
  return PIDS.find(pid => PARTIES[pid].all === key || PARTIES[pid].bonus === key) || PIDS[0];
}
function isAll(key){ return PIDS.some(pid => PARTIES[pid].all === key); }
function isBonus(key){ return key != null && PIDS.some(pid => PARTIES[pid].bonus === key); }
function parseKey(p){
  if (p == null || p === "") return null;
  if (/^\d+$/.test(p)){ const n = Number(p); return PIDS.some(pid => PARTIES[pid].chaps.includes(n)) ? n : null; }
  return PIDS.flatMap(pid => [PARTIES[pid].all, PARTIES[pid].bonus]).find(k => k && k === p) || null;
}
function pool(key){
  const P = PARTIES[partOf(key)];
  if (key === P.all) return P.chaps.flatMap(ch => QUIZ[ch].questions);
  if (key === P.bonus) return BONUS[P.id].questions;
  return QUIZ[key].questions;
}
function title(key){ return isAll(key) ? "Tous les chapitres" : isBonus(key) ? BONUS[partOf(key)].nom : QUIZ[key].nom; }
function partLabel(pid){ return "Partie" + NB + PARTIES[pid].numero; }
function chapName(q){ return q.bonus ? (CHAPITRES[q.ch] || "") : QUIZ[q.ch].nom; }
function chapLabel(q){ return "Chapitre " + q.ch + " · " + chapName(q); }
function span(list){ return list.length > 1 ? list[0] + "–" + list[list.length - 1] : String(list[0]); }
function bonusScope(pid){ const c = BONUS[pid].chaps; return c.length > 1 ? "chapitres " + c[0] + " à " + c[c.length - 1] : "chapitre " + c[0]; }

/* ---------- mémoire locale (résultats et quiz en cours) ---------- */
function load(){ try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {best: {}, progress: {}}; } catch (e) { return {best: {}, progress: {}}; } }
let store = load();
store.best = store.best || {}; store.progress = store.progress || {};
function save(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {} }

/* ---------- état ---------- */
const S = {view: "home", key: null, part: PIDS[0], order: [], answers: [], idx: 0, start: 0, shuffle: false, retry: false};

/* ---------- outils ---------- */
const app = document.getElementById("app");
const parts = document.getElementById("parts");
const chain = document.getElementById("chain");
const live = document.getElementById("live");
const dlg = document.getElementById("qrDialog");
function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})){
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v; else if (k === "html") e.innerHTML = v; else e.setAttribute(k, v);
  }
  for (const k of kids) if (k != null && k !== false) e.append(k);
  return e;
}
function star(){ return el("span", {html: ICON_STAR, style: "display:contents"}); }
function button(text, cls, onClick, attrs){
  const b = el("button", Object.assign({type: "button", class: cls}, attrs || {}));
  if (text.startsWith("<")) b.innerHTML = text; else b.textContent = text;
  b.addEventListener("click", onClick);
  return b;
}
function put(...nodes){ app.replaceChildren(...nodes.filter(Boolean)); }
function say(t){ live.textContent = ""; setTimeout(() => { live.textContent = t; }, 30); }
function link(key, corrige){ return key != null ? "?partie=" + key + (corrige ? "&corrige" : "") : "?"; }
function quizUrl(key){ return ADRESSE_SITE + (key != null ? "?partie=" + key : ""); }
function shuffled(a){ const r = a.slice(); for (let i = r.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
function duration(sec){ const m = Math.floor(sec / 60), s = sec % 60; return (m ? m + NB + "min" + NB : "") + s + NB + "s"; }
function today(){ return new Date().toLocaleDateString("fr-CH"); }
function pct(score, total){ return Math.round(score / total * 100); }

/* ---------- navigation sans rechargement ---------- */
function go(view, key){
  S.view = view; S.key = key === undefined ? S.key : key;
  if (S.key != null) S.part = partOf(S.key);
  const url = view === "home" ? location.pathname : link(S.key, view === "correction");
  try { history.replaceState(null, "", url); } catch (e) {}
  render();
  window.scrollTo(0, 0);
}
function navLink(text, view, key, cls){
  const a = el("a", {href: link(key, view === "correction"), class: cls});
  if (text) a.textContent = text;
  a.addEventListener("click", ev => { ev.preventDefault(); go(view, key); });
  return a;
}
function renderParts(){
  parts.replaceChildren(...PIDS.map(pid => {
    const a = el("a", {href: location.pathname, "aria-current": pid === S.part ? "true" : null},
      el("b", {text: partLabel(pid)}), " " + PARTIES[pid].titre);
    a.addEventListener("click", ev => { ev.preventDefault(); S.part = pid; go("home", null); });
    return el("li", {}, a);
  }));
}
function renderChain(){
  const P = PARTIES[S.part];
  const target = S.view === "correction" ? "correction" : "intro";
  const items = P.chaps.map(ch => {
    const a = navLink(QUIZ[ch].nom, target, ch);
    if (ch === S.key) a.setAttribute("aria-current", "page");
    return el("li", {}, a, el("small", {text: "Chapitre " + ch}));
  });
  if (P.bonus){
    const a = navLink("", target, P.bonus);
    a.append(star(), BONUS[P.id].nom);
    if (S.key === P.bonus) a.setAttribute("aria-current", "page");
    items.push(el("li", {class: "accent-bonus"}, a, el("small", {text: "Chapitres " + span(BONUS[P.id].chaps)})));
  }
  chain.replaceChildren(...items);
}
function hero(key, h1){
  const pid = partOf(key), n = pool(key).length;
  const sub = isAll(key) ? partLabel(pid) + " · " + PARTIES[pid].chaps.length + " chapitres · " + n + " questions"
    : isBonus(key) ? BONUS[pid].sujet + " · " + bonusScope(pid) + " · " + n + " questions · cours" + NB + "p." + NB + BONUS[pid].pages
    : "Chapitre " + key + " · " + QUIZ[key].sujet + " · cours" + NB + "p." + NB + QUIZ[key].pages;
  const num = isBonus(key) ? el("span", {class: "numeral", "aria-hidden": "true", html: ICON_STAR})
    : el("span", {class: "numeral", "aria-hidden": "true", text: isAll(key) ? span(PARTIES[pid].chaps) : String(key)});
  return el("section", {class: "hero"}, num, el("div", {}, el("h1", {text: h1}), el("p", {text: sub})));
}
function tools(key){
  const t = el("div", {class: "tools"}, button(ICON_QR + "<span>Afficher le QR code</span>", "outline", () => openQr(key)));
  if (!isAll(key)){
    const on = S.view === "correction";
    t.append(button(on ? "Masquer la correction" : "Afficher la correction", "outline", () => go(on ? "intro" : "correction", key), {"aria-pressed": String(on)}));
  }
  if (document.fullscreenEnabled){
    t.append(button(document.fullscreenElement ? "Quitter le plein écran" : "Plein écran", "outline", () => {
      const p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
      Promise.resolve(p).catch(() => {}).then(() => render());
    }));
  }
  return t;
}
function citation(q){
  if (!q.c) return null;
  return el("figure", {class: "cite"},
    el("figcaption", {text: "Source : " + SUPPORT + ", p." + NB + q.p}),
    el("blockquote", {text: "«" + NB + q.c + NB + "»"}));
}

/* ---------- accueil ---------- */
function bestLabel(key){
  const b = store.best[key];
  const p = store.progress[key];
  if (p && p.answers && p.answers.length && p.answers.length < p.order.length) return el("span", {class: "go"}, el("b", {text: "En cours"}), "question " + (p.answers.length + 1) + " / " + p.order.length);
  if (b) return el("span", {class: "go"}, el("b", {text: b.score + " / " + b.total}), "meilleur score");
  return el("span", {class: "go"}, el("b", {text: pool(key).length + " questions"}), "à faire");
}
function renderHome(){
  const P = PARTIES[S.part];
  document.title = "Quiz MT_322 · " + partLabel(P.id);
  const items = P.chaps.map(ch => {
    const c = QUIZ[ch];
    const a = navLink("", "intro", ch);
    a.append(el("span", {class: "d", text: String(ch), "aria-hidden": "true"}),
      el("span", {}, el("span", {class: "t", text: c.nom}), el("span", {class: "s", text: c.sujet + " · cours" + NB + "p." + NB + c.pages})),
      bestLabel(ch));
    return el("li", {}, a);
  });
  if (P.chaps.length > 1){
    const all = navLink("", "intro", P.all);
    all.append(el("span", {class: "d", text: span(P.chaps), "aria-hidden": "true"}),
      el("span", {}, el("span", {class: "t", text: "Tous les chapitres"}), el("span", {class: "s", text: "Révision complète · " + pool(P.all).length + " questions"})),
      bestLabel(P.all));
    items.push(el("li", {class: "all"}, all));
  }
  if (P.bonus){
    const B = BONUS[P.id];
    const bonus = navLink("", "intro", P.bonus);
    bonus.append(el("span", {class: "d", html: ICON_STAR, "aria-hidden": "true"}),
      el("span", {}, el("span", {class: "t", text: B.nom}), el("span", {class: "s", text: B.sujet + " · " + bonusScope(P.id) + " · " + pool(P.bonus).length + " questions"})),
      bestLabel(P.bonus));
    items.push(el("li", {class: "bonus accent-bonus"}, bonus));
  }
  const reset = Object.keys(store.best).length || Object.keys(store.progress).length
    ? el("div", {class: "foot-actions"}, button("Effacer mes résultats sur cet appareil", "link", () => { store = {best: {}, progress: {}}; save(); render(); say("Résultats effacés."); }))
    : null;
  put(el("section", {class: "home"},
    el("h1", {text: "Quiz de fin de chapitre"}),
    el("p", {class: "lead", text: "Choisissez le chapitre indiqué par votre enseignant. Une question s’affiche à la fois, avec sa correction."}),
    el("div", {class: "tools"}, button(ICON_QR + "<span>Afficher le QR code</span>", "outline", () => openQr(null))),
    el("ul", {class: "list"}, ...items), reset));
}

/* ---------- introduction d'un quiz ---------- */
function startQuiz(key, opts){
  const n = pool(key).length;
  let order = opts && opts.order ? opts.order : [...Array(n).keys()];
  if (S.shuffle && !(opts && opts.order)) order = shuffled(order);
  Object.assign(S, {key, order, answers: [], idx: 0, start: Date.now(), retry: !!(opts && opts.retry)});
  if (!S.retry){ store.progress[key] = {order, answers: [], start: S.start, shuffle: S.shuffle}; save(); }
  go("question", key);
}
function resumeQuiz(key){
  const p = store.progress[key];
  Object.assign(S, {key, order: p.order, answers: p.answers.slice(), idx: p.answers.length, start: p.start || Date.now(), retry: false, shuffle: !!p.shuffle});
  go("question", key);
}
function renderIntro(){
  const key = S.key, n = pool(key).length;
  document.title = "Quiz · " + title(key);
  const p = store.progress[key];
  const inProgress = p && p.answers && p.answers.length > 0 && p.answers.length < p.order.length;
  const b = store.best[key];
  const shuffle = el("input", {type: "checkbox", id: "shuffle"});
  shuffle.checked = S.shuffle;
  shuffle.addEventListener("change", () => { S.shuffle = shuffle.checked; });
  const actions = el("div", {class: "row"});
  if (inProgress){
    actions.append(button("Reprendre à la question " + (p.answers.length + 1), "primary big", () => resumeQuiz(key)),
      button("Recommencer", "outline big", () => startQuiz(key)));
  } else {
    actions.append(button("Commencer le quiz", "primary big", () => startQuiz(key)));
  }
  put(
    hero(key, title(key)),
    tools(key),
    el("section", {class: "start"},
      el("ul", {class: "facts"},
        el("li", {}, el("b", {text: String(n)}), " questions"),
        el("li", {}, "Durée" + NB + ": ", el("b", {text: "environ " + Math.max(1, Math.round(n * 0.75)) + NB + "min"})),
        b ? el("li", {}, "Meilleur score" + NB + ": ", el("b", {text: b.score + " / " + b.total})) : null),
      el("div", {class: "brief"},
        isBonus(key) ? el("p", {text: "Ces questions complètent les quiz de fin de chapitre. Elles portent sur les " + bonusScope(partOf(key)) + "."}) : null,
        el("p", {text: "Lisez la question et choisissez une réponse."}),
        el("p", {text: "La correction s’affiche aussitôt, avec la citation du cours."}),
        el("p", {text: "Une synthèse termine le quiz."})),
      el("label", {class: "check", for: "shuffle"}, shuffle, "Mélanger l’ordre des questions"),
      actions,
      el("p", {class: "hint", text: "Clavier" + NB + ": touches A, B, C, D pour répondre, Entrée pour continuer."})));
}

/* ---------- question ---------- */
function current(){ return pool(S.key)[S.order[S.idx]]; }
function segs(){
  return el("ol", {class: "segs", "aria-hidden": "true"}, ...S.order.map((qi, k) => {
    const q = pool(S.key)[qi];
    const a = S.answers[k];
    return el("li", {class: a === undefined ? (k === S.idx ? "now" : "") : (a === q.a ? "ok" : "ko")});
  }));
}
function scoreSoFar(){ return S.answers.filter((a, k) => a === pool(S.key)[S.order[k]].a).length; }
function renderQuestion(){
  const q = current(), total = S.order.length, n = S.idx + 1;
  const answered = S.answers[S.idx] !== undefined;
  document.title = "Question " + n + " / " + total + " · " + title(S.key);
  const opts = el("div", {class: "opts", role: "group", "aria-labelledby": "qt"});
  q.o.forEach((o, j) => {
    const b = el("button", {type: "button", class: "opt", "data-j": String(j)},
      el("span", {class: "l", text: L[j], "aria-hidden": "true"}),
      el("span", {}, el("span", {class: "vh", text: "Réponse " + L[j] + " : "}), o),
      el("span", {class: "tag"}));
    b.addEventListener("click", () => choose(j));
    opts.append(b);
  });
  const fbBox = el("div", {id: "fb"});
  const nextBox = el("div", {class: "next", id: "nextBox"});
  put(
    el("div", {class: "qhead"},
      el("span", {}, "Question ", el("b", {text: n + " / " + total}), S.retry ? " · questions manquées" : ""),
      button("Quitter", "link", () => go("intro", S.key))),
    segs(),
    el("section", {class: "qtitle"},
      el("span", {class: "qnum", text: String(n), "aria-hidden": "true"}),
      el("h2", {id: "qt", tabindex: "-1"},
        el("span", {class: "qchap", text: chapLabel(q)}), q.q)),
    opts, fbBox, nextBox);
  if (answered) showFeedback(false); else document.getElementById("qt").focus({preventScroll: true});
}
function choose(j){
  if (S.view !== "question" || S.answers[S.idx] !== undefined) return;
  S.answers[S.idx] = j;
  if (!S.retry){ store.progress[S.key] = {order: S.order, answers: S.answers.slice(), start: S.start, shuffle: S.shuffle}; save(); }
  showFeedback(true);
}
function showFeedback(announce){
  const q = current(), j = S.answers[S.idx], ok = j === q.a;
  document.querySelectorAll(".opt").forEach((b, k) => {
    b.setAttribute("aria-disabled", "true");
    if (k === q.a){ b.classList.add("right"); b.querySelector(".tag").textContent = "Bonne réponse"; }
    else if (k === j){ b.classList.add("wrong"); b.querySelector(".tag").textContent = "Votre réponse"; }
    else b.classList.add("dim");
  });
  document.querySelector(".segs").replaceWith(segs());
  const head = ok ? "Juste." : "Faux. Bonne réponse" + NB + ": " + L[q.a] + ".";
  document.getElementById("fb").replaceChildren(el("div", {class: "fb " + (ok ? "ok" : "ko")},
    el("strong", {text: head}), " " + q.e, citation(q)));
  const last = S.idx === S.order.length - 1;
  const nb = button(last ? "Voir la synthèse" : "Question suivante", "primary big", next, {id: "nextBtn"});
  document.getElementById("nextBox").replaceChildren(
    el("span", {class: "score-live", text: "Score" + NB + ": " + scoreSoFar() + " / " + (S.idx + 1)}), nb);
  if (announce) say(head + " " + q.e);
  nb.focus({preventScroll: true});
  document.getElementById("fb").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "nearest"});
}
function next(){
  if (S.answers[S.idx] === undefined) return;
  if (S.idx < S.order.length - 1){ S.idx++; render(); window.scrollTo(0, 0); }
  else finish();
}

/* ---------- synthèse ---------- */
function finish(){
  const total = S.order.length, score = scoreSoFar();
  S.seconds = Math.round((Date.now() - S.start) / 1000);
  if (!S.retry){
    const b = store.best[S.key];
    if (!b || score > b.score) store.best[S.key] = {score, total, date: today()};
    delete store.progress[S.key];
    save();
  }
  go("summary", S.key);
}
function verdict(score, total){
  const r = score / total;
  if (r === 1) return "Toutes vos réponses sont justes.";
  if (r >= 0.8) return "Très bon résultat. Relisez la correction des questions manquées.";
  if (r >= 0.6) return "Résultat correct. Relisez les passages du cours cités ci-dessous.";
  return "Relisez le chapitre dans le cours, puis refaites le quiz.";
}
function renderSummary(){
  const key = S.key, pid = partOf(key), total = S.order.length, score = scoreSoFar();
  const qs = S.order.map(i => pool(key)[i]);
  const missed = S.order.filter((qi, k) => S.answers[k] !== pool(key)[qi].a);
  document.title = "Synthèse · " + title(key);
  const resultText = "Quiz MT_322 · " + partLabel(pid) + " · " + (isAll(key) || isBonus(key) ? title(key) : "Chapitre " + key + " " + QUIZ[key].nom)
    + (S.retry ? " (questions manquées)" : "") + " : " + score + "/" + total + " (" + pct(score, total) + " %) · " + today();
  const actions = el("div", {class: "row"});
  if (missed.length) actions.append(button(missed.length > 1 ? "Refaire les " + missed.length + " questions manquées" : "Refaire la question manquée", "primary", () => startQuiz(key, {order: missed, retry: true})));
  actions.append(button("Recommencer le quiz", "ghost", () => startQuiz(key)));
  const seq = PARTIES[pid].sequence;
  const nextKey = isAll(key) ? null : seq[seq.indexOf(key) + 1];
  if (nextKey != null) actions.append(button("Quiz suivant" + NB + ": " + title(nextKey), "ghost", () => go("intro", nextKey)));
  actions.append(button("Copier mon résultat", "ghost", ev => copyText(resultText, ev.currentTarget, "Résultat copié")));
  const best = store.best[key];
  const result = el("section", {class: "result", "aria-labelledby": "rt"},
    el("h2", {id: "rt", text: S.retry ? "Synthèse des questions manquées" : "Synthèse"}),
    el("p", {class: "score"}, String(score), el("span", {text: " / " + total})),
    el("p", {class: "meta", text: pct(score, total) + NB + "% de réponses justes · durée" + NB + ": " + duration(S.seconds || 0)
      + (best && !S.retry ? " · meilleur score" + NB + ": " + best.score + " / " + best.total : "")}),
    el("ol", {class: "segs", "aria-hidden": "true"}, ...S.order.map((qi, k) => el("li", {class: S.answers[k] === pool(key)[qi].a ? "ok" : "ko"}))),
    el("p", {class: "verdict", text: verdict(score, total)}),
    actions);
  let table = null;
  if (isAll(key) || isBonus(key)){
    const list = isAll(key) ? PARTIES[pid].chaps : BONUS[pid].chaps;
    const rows = list.map(ch => {
      const ks = S.order.map((qi, k) => k).filter(k => pool(key)[S.order[k]].ch === ch);
      if (!ks.length) return null;
      const ok = ks.filter(k => S.answers[k] === pool(key)[S.order[k]].a).length;
      return el("tr", {}, el("td", {text: ch + " · " + chapName(pool(key)[S.order[ks[0]]])}), el("td", {text: ok + " / " + ks.length}));
    }).filter(Boolean);
    table = el("table", {class: "bychap"}, el("thead", {}, el("tr", {}, el("th", {text: "Chapitre"}), el("th", {text: "Score"}))), el("tbody", {}, ...rows));
  }
  const recap = el("ol", {class: "recap"}, ...qs.map((q, k) => {
    const a = S.answers[k], ok = a === q.a;
    const d = el("details", {open: ok ? null : ""},
      el("summary", {}, el("span", {class: "mark " + (ok ? "ok" : "ko"), text: ok ? "✓" : "✗", "aria-label": ok ? "Juste" : "Faux"}), el("span", {text: (k + 1) + ". " + q.q})),
      el("div", {class: "body"},
        el("p", {}, el("strong", {text: "Votre réponse" + NB + ": "}), L[a] + ". " + q.o[a]),
        ok ? null : el("p", {}, el("strong", {text: "Bonne réponse" + NB + ": "}), L[q.a] + ". " + q.o[q.a]),
        el("p", {text: q.e}),
        citation(q)));
    return el("li", {}, d);
  }));
  put(
    hero(key, title(key)),
    result,
    table ? el("h3", {class: "sec", text: "Résultat par chapitre"}) : null, table,
    el("h3", {class: "sec", text: "Détail des réponses"}), recap,
    el("div", {class: "row"}, navLink("Retour aux chapitres", "home", null, "btn outline")));
  say("Synthèse : " + score + " sur " + total + ". " + verdict(score, total));
}

/* ---------- correction enseignant ---------- */
function renderCorrection(){
  const key = S.key;
  document.title = "Correction · " + title(key);
  const list = el("div", {});
  pool(key).forEach((q, i) => {
    const s = el("section", {class: "q"});
    s.append(el("h2", {}, el("span", {class: "n", text: String(i + 1), "aria-hidden": "true"}),
      el("span", {}, q.bonus ? el("span", {class: "qchap", text: chapLabel(q)}) : null, q.q)));
    const opts = el("div", {class: "opts"});
    q.o.forEach((o, j) => opts.append(el("div", {class: "opt" + (j === q.a ? " right" : " dim"), "aria-disabled": "true"},
      el("span", {class: "l", text: L[j]}), el("span", {}, o), el("span", {class: "tag", text: j === q.a ? "Bonne réponse" : ""}))));
    s.append(opts, el("div", {class: "fb ok"}, el("strong", {text: "Réponse" + NB + ": " + L[q.a] + "."}), " " + q.e, citation(q)));
    list.append(s);
  });
  put(hero(key, "Correction" + NB + ": " + title(key)), tools(key),
    el("div", {class: "brief"}, el("p", {text: "Les bonnes réponses sont en vert, avec l’explication et la citation du cours " + SUPPORT + "."})),
    list);
}

/* ---------- rendu ---------- */
function render(){
  app.classList.toggle("accent-bonus", S.view !== "home" && isBonus(S.key));
  renderParts();
  renderChain();
  if (S.view === "intro") renderIntro();
  else if (S.view === "question") renderQuestion();
  else if (S.view === "summary") renderSummary();
  else if (S.view === "correction") renderCorrection();
  else renderHome();
}

/* ---------- clavier ---------- */
document.addEventListener("keydown", ev => {
  if (dlg.open || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
  if (S.view !== "question") return;
  const k = ev.key.toUpperCase();
  const map = {A: 0, B: 1, C: 2, D: 3, "1": 0, "2": 1, "3": 2, "4": 3};
  if (k in map && S.answers[S.idx] === undefined && map[k] < current().o.length){ ev.preventDefault(); choose(map[k]); }
  else if ((ev.key === "Enter" || ev.key === "ArrowRight") && S.answers[S.idx] !== undefined && document.activeElement.id !== "nextBtn"){ ev.preventDefault(); next(); }
});

/* ---------- copie dans le presse-papiers ---------- */
function copyText(text, btn, okLabel){
  const label = btn.textContent;
  const done = () => { btn.textContent = okLabel; setTimeout(() => { btn.textContent = label; }, 2000); };
  const fallback = () => {
    const t = el("textarea", {class: "vh"}); t.value = text; document.body.append(t); t.select();
    try { document.execCommand("copy"); done(); } catch (e) {} t.remove();
  };
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
}

/* ---------- fenêtre QR code ---------- */
function openQr(key){
  const url = quizUrl(key);
  const name = key == null ? "Quiz de fin de chapitre"
    : "Quiz · " + (isAll(key) ? partLabel(partOf(key)) + " · tous les chapitres" : isBonus(key) ? partLabel(partOf(key)) + " · bonus" : "chapitre " + key + " · " + QUIZ[key].nom);
  document.getElementById("qrTitle").textContent = name;
  document.getElementById("qrUrl").textContent = url;
  dlg.classList.toggle("accent-bonus", isBonus(key));
  const box = document.getElementById("qrCode");
  if (typeof qrcode === "function"){
    const qr = qrcode(0, "M"); qr.addData(url); qr.make();
    box.innerHTML = qr.createSvgTag({cellSize: 8, margin: 16, scalable: true, title: "QR code : " + url});
  } else {
    box.textContent = "QR code indisponible sans connexion internet. Utilisez le lien ci-dessous.";
  }
  if (typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open", "");
}
function closeQr(){ if (typeof dlg.close === "function") dlg.close(); else dlg.removeAttribute("open"); }
document.getElementById("qrClose").addEventListener("click", closeQr);
dlg.addEventListener("click", ev => { if (ev.target === dlg) closeQr(); });
document.getElementById("qrCopy").addEventListener("click", ev => copyText(document.getElementById("qrUrl").textContent, ev.currentTarget, "Lien copié"));
document.addEventListener("fullscreenchange", () => { if (S.view === "intro" || S.view === "correction") render(); });

/* ---------- démarrage ---------- */
function route(){
  let p = null, corrige = false;
  try { const u = new URLSearchParams(location.search); p = u.get("partie"); corrige = u.has("corrige"); } catch (e) {}
  if (!p){ const m = location.hash.match(/tout(?:-\d+)?|bonus(?:-\d+)?|\d+/); if (m) p = m[0]; }
  const key = parseKey(p);
  if (key == null){ S.view = "home"; render(); return; }
  S.key = key; S.part = partOf(key);
  S.view = corrige && !isAll(key) ? "correction" : "intro";
  render();
}
route();
window.addEventListener("hashchange", route);
</script>
