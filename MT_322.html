function el(tag, attrs, ...kids){

    return el("li", {}, el("a", {href: link(ch)},
      el("span", {class: "d", text: String(ch), "aria-hidden": "true"}),
      el("span", {}, el("span", {class: "t", text: c.nom}), el("span", {class: "s", text: c.sujet + " · cours" + NB + "p." + NB + c.pages})),
      el("span", {class: "go", text: c.questions.length + " questions"})));
  }));
  app.replaceChildren(el("section", {class: "home"},
    el("h1", {text: "Quiz de fin de chapitre"}),
    el("p", {class: "lead", text: "Choisissez le chapitre indiqué par votre enseignant."}),
    list));
}

function renderQuiz(ch){
  const c = QUIZ[ch];
  document.title = "Quiz " + ch + " · " + c.nom + " – MT_322";
  renderChain(ch);
  const form = el("form", {id: "quiz", novalidate: ""});
  c.questions.forEach((q, i) => {
    const fs = el("fieldset", {class: "q", id: "q" + i});
    fs.append(el("legend", {}, el("span", {class: "n", text: String(i + 1), "aria-hidden": "true"}),
      el("span", {}, el("span", {class: "vh", text: "Question " + (i + 1) + " : "}), q.q)));
    const opts = el("div", {class: "opts"});
    q.o.forEach((o, j) => {
      const id = "q" + i + "o" + j;
      const input = el("input", {type: "radio", name: "q" + i, id, value: String(j)});
      opts.append(el("label", {class: "opt", for: id}, input,
        el("span", {class: "l", text: L[j], "aria-hidden": "true"}),
        el("span", {}, el("span", {class: "vh", text: "Réponse " + L[j] + " : "}), o),
        el("span", {class: "tag"})));
    });
    fs.append(opts);
    form.append(fs);
  });
  form.addEventListener("change", updateCount);
  const next = keys[keys.indexOf(ch) + 1];
  app.replaceChildren(
    el("section", {class: "hero"},
      el("span", {class: "numeral", text: String(ch), "aria-hidden": "true"}),
      el("div", {}, el("h1", {text: c.nom}), el("p", {text: "Chapitre " + ch + " · " + c.sujet + " · cours" + NB + "p." + NB + c.pages}))),
    el("div", {id: "result"}),
    el("div", {class: "brief"},
      el("p", {text: "Choisissez une réponse par question."}),
      el("p", {text: "Validez à la fin : la page affiche votre score et la correction."})),
    form,
    el("p", {class: "msg", id: "msg", role: "alert"}));
  app.dataset.chapter = ch;
  app.dataset.next = next || "";
  bar.hidden = false;
  btn.hidden = false;
  updateCount();
}

function answers(){
  const c = QUIZ[app.dataset.chapter];
  return c.questions.map((_, i) => {
    const r = document.querySelector('input[name="q' + i + '"]:checked');
    return r ? Number(r.value) : null;
  });
}
function updateCount(){
  const a = answers();
  const n = a.filter(v => v !== null).length;
  count.innerHTML = "<b>" + n + " / " + a.length + "</b> réponses";
  document.getElementById("msg").textContent = "";
}

function validate(){
  const ch = Number(app.dataset.chapter);
  const c = QUIZ[ch];
  const a = answers();
  const missing = a.map((v, i) => v === null ? i + 1 : null).filter(Boolean);
  if (missing.length){
    document.getElementById("msg").textContent =
      "Répondez à toutes les questions. Sans réponse" + NB + ": question" + (missing.length > 1 ? "s " : " ") + missing.join(", ") + ".";
    document.getElementById("q" + (missing[0] - 1)).querySelector("input").focus();
    return;
  }
  let score = 0;
  const form = document.getElementById("quiz");
  form.classList.add("done");
  c.questions.forEach((q, i) => {
    const fs = document.getElementById("q" + i);
    const ok = a[i] === q.a;
    if (ok) score++;
    fs.querySelectorAll("input").forEach(inp => inp.disabled = true);
    const labels = fs.querySelectorAll(".opt");
    labels[q.a].classList.add("right");
    labels[q.a].querySelector(".tag").textContent = "Bonne réponse";
    if (!ok){
      labels[a[i]].classList.add("wrong");
      labels[a[i]].querySelector(".tag").textContent = "Votre réponse";
    }
    const fb = el("div", {class: "fb " + (ok ? "ok" : "ko")},
      el("strong", {text: ok ? "Juste." : "Faux. Bonne réponse" + NB + ": " + L[q.a] + "."}), " " + q.e,
      el("span", {class: "src", text: "Cours p." + NB + q.p}));
    fs.append(fb);
  });
  const total = c.questions.length;
  const actions = el("div", {class: "actions"});
  const again = el("button", {type: "button", class: "ghost", text: "Recommencer"});
  again.addEventListener("click", () => { renderQuiz(ch); window.scrollTo(0, 0); });
  actions.append(again);
  if (app.dataset.next){
    const n = Number(app.dataset.next);
    actions.append(el("a", {class: "btn primary", href: link(n), text: "Quiz suivant" + NB + ": " + QUIZ[n].nom}));
  }
  const res = el("section", {class: "result", "aria-labelledby": "rt"},
    el("h2", {id: "rt", text: "Votre résultat"}),
    el("p", {class: "score"}, String(score), el("span", {text: " / " + total})),
    el("ul", {class: "dots", "aria-hidden": "true"}, ...a.map((v, i) => el("li", {class: v === c.questions[i].a ? "ok" : "ko"}))),
    el("p", {text: score === total ? "Toutes vos réponses sont justes." : "Relisez la correction sous chaque question."}),
    actions);
  document.getElementById("result").replaceChildren(res);
  bar.hidden = true;
  res.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start"});
}

btn.addEventListener("click", validate);
function renderCorrige(ch){
  const c = QUIZ[ch];
  document.title = "Corrigé " + ch + " · " + c.nom + " – MT_322";
  renderChain(ch);
  bar.hidden = true;
  const list = el("div", {class: "done"});
  c.questions.forEach((q, i) => {
    const fs = el("section", {class: "q", "aria-labelledby": "h" + i});
    fs.append(el("h2", {class: "legend", id: "h" + i}, el("span", {class: "n", text: String(i + 1), "aria-hidden": "true"}), el("span", {}, q.q)));
    const opts = el("div", {class: "opts"});
    q.o.forEach((o, j) => {
      const row = el("div", {class: "opt" + (j === q.a ? " right" : "")},
        el("span", {class: "l", text: L[j]}), el("span", {}, o), el("span", {class: "tag", text: j === q.a ? "Bonne réponse" : ""}));
      opts.append(row);
    });
    fs.append(opts, el("div", {class: "fb ok"}, el("strong", {text: "Réponse" + NB + ": " + L[q.a] + "."}), " " + q.e,
      el("span", {class: "src", text: "Cours p." + NB + q.p})));
    list.append(fs);
  });
  app.replaceChildren(
    el("section", {class: "hero"},
      el("span", {class: "numeral", text: String(ch), "aria-hidden": "true"}),
      el("div", {}, el("h1", {text: "Corrigé : " + c.nom}), el("p", {text: "Chapitre " + ch + " · " + c.sujet + " · cours" + NB + "p." + NB + c.pages}))),
    el("div", {class: "brief"},
      el("p", {text: "Les bonnes réponses sont en vert, avec l’explication et la page du cours."}),
      el("p", {}, el("a", {href: link(ch, false), text: "Ouvrir le quiz du chapitre " + ch}))),
    list);
}

function route(){
  const ch = chapterFromUrl();
  if (ch && MODE_CORRIGE) renderCorrige(ch);
  else if (ch) renderQuiz(ch);
  else renderHome();
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
