<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistant Métrologie - Le Bon Choix</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* --- Base Styles --- */
        :root {
            --primary: #1a1a1a;
            --accent: #cfa346;
            --accent-text: #856404;
            --accent-light: #f4e8cb;
            --bg-color: #f8f9fa;
            --panel-bg: #ffffff;
            --border-color: #e0e0e0;
            --text-color: #2d3436;
            
            --success: #27ae60;
            --warning: #d35400;
            --danger: #c0392b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .game-container {
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            border-radius: 12px;
            border: 4px solid var(--accent);
            background-color: var(--panel-bg);
            width: 100%;
            max-width: 1200px;
            min-height: 700px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
        }

        .step-transition {
            animation: fadeIn 0.4s ease-in-out;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Boutons personnalisés */
        .btn-gold {
            background-color: var(--accent);
            color: var(--primary);
            border: none;
            font-weight: bold;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-gold:hover:not(:disabled) { 
            background-color: #e0b45a; 
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(207, 163, 70, 0.3);
        }
        .btn-gold:disabled {
            background-color: #e0e0e0;
            color: #999;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: 1px solid var(--primary);
            font-weight: bold;
            transition: all 0.2s;
        }
        .btn-primary:hover {
            background-color: #333;
            transform: translateY(-1px);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text-color);
            border: 2px solid var(--border-color);
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-outline:hover {
            border-color: var(--primary);
            background-color: #f8f9fa;
        }

        .input-tech {
            background-color: #f8f9fa;
            border: 2px solid var(--border-color);
            color: var(--primary);
            font-family: 'Consolas', monospace;
            font-weight: bold;
            transition: all 0.2s;
        }
        .input-tech:focus {
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 0 3px rgba(207, 163, 70, 0.1);
        }

        .progress-track {
            background-color: #eee;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            background-color: var(--accent);
            height: 100%;
            transition: width 0.5s ease;
        }

        .custom-scroll::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        /* Styles spécifiques au Dashboard sélection */
        .inst-card {
            transition: all 0.2s;
        }
        .inst-card:hover {
            background-color: #f9fafb;
        }
        .inst-card.selected {
            background-color: #fffbeb; /* amber-50 */
            border-color: var(--accent);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center;
            z-index: 50;
            backdrop-filter: blur(2px);
        }
        .modal-content {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            max-width: 900px;
            width: 95%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            border: 2px solid var(--accent);
        }

        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background-color: white; padding: 0; display: block; }
            .game-container { box-shadow: none; border: 1px solid #000; padding: 0; max-width: none; min-height: 0; }
            .inst-list-col { display: none; } /* Cache la liste pour ne garder que le rapport */
            .main-content-col { width: 100% !important; border: none !important; }
        }
    </style>
</head>
<body>

    <div id="root" class="w-full flex justify-center"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- ICONS ---
        const IconBase = ({ children, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        const MeasIcons = {
            Exterieur: () => (<IconBase className="text-[var(--primary)]" size={32}><path d="M4 22V2" strokeWidth="2"/><path d="M20 22V2" strokeWidth="2"/><path d="M4 12h5" /><path d="M20 12h-5" /><path d="M8 9l3 3-3 3" /><path d="M16 9l-3 3 3 3" /><rect x="9" y="7" width="6" height="10" stroke="currentColor" strokeDasharray="2 2" className="opacity-50"/></IconBase>),
            Interieur: () => (<IconBase className="text-[var(--primary)]" size={32}><path d="M2 4h4v16H2" /><path d="M22 4h-4v16h4" /><path d="M6 12h5" /><path d="M18 12h-5" /><path d="M10 9l-3 3 3 3" /><path d="M14 9l3 3-3 3" /></IconBase>),
            Profondeur: () => (<IconBase className="text-[var(--primary)]" size={32}><path d="M2 4h20" /><path d="M5 4v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V4" /><path d="M12 4v12" strokeWidth="2"/><path d="M9 13l3 3 3-3" /></IconBase>),
            Hauteur: () => (<IconBase className="text-[var(--primary)]" size={32}><path d="M2 20h20" strokeWidth="2"/><path d="M6 20V8h8" /><path d="M18 20V4" /><path d="M18 6h3"/><path d="M21 4l-3 2" /></IconBase>),
            Angle: () => (<IconBase className="text-[var(--primary)]" size={32}><path d="M3 21h18" strokeWidth="2"/><path d="M3 21L15 3" strokeWidth="2"/><path d="M8 21a5 5 0 0 1 2-8" /></IconBase>),
            Surface: () => (<IconBase className="text-[var(--primary)]" size={32}><path d="M2 18h20" /><path d="M6 18l4-8 4 8" /><path d="M10 10h5" /><circle cx="16" cy="9" r="1" fill="currentColor"/></IconBase>)
        };

        // --- ICONES INSTRUMENTS REALISTES ---
        const InstIcons = {
            Caliper: () => (<IconBase size={36} className="text-gray-700"><path d="M4 4h16v16" strokeWidth="2"/><path d="M6 4v14"/><path d="M6 7h10"/><path d="M16 7v-2"/><path d="M16 11v-4"/><path d="M4 14h6"/><path d="M8 14v4"/><path d="M20 4v6"/></IconBase>),
            Micrometer: () => (<IconBase size={36} className="text-gray-700"><path d="M3 10a7 7 0 0 0 14 0" strokeWidth="2"/><path d="M17 7h5v6h-5z"/><line x1="3" y1="10" x2="10" y2="10"/><line x1="17" y1="10" x2="14" y2="10"/></IconBase>),
            Ruler: () => (<IconBase size={36} className="text-gray-700"><rect x="2" y="8" width="20" height="8" rx="1" strokeWidth="2"/><line x1="6" y1="8" x2="6" y2="11"/><line x1="10" y1="8" x2="10" y2="11"/><line x1="14" y1="8" x2="14" y2="11"/><line x1="18" y1="8" x2="18" y2="11"/></IconBase>),
            DepthGauge: () => (<IconBase size={36} className="text-gray-700"><rect x="6" y="4" width="12" height="4" strokeWidth="2"/><line x1="12" y1="8" x2="12" y2="22" strokeWidth="2"/><line x1="10" y1="22" x2="14" y2="22"/></IconBase>),
            Comparator: () => (<IconBase size={36} className="text-gray-700"><circle cx="12" cy="9" r="6" strokeWidth="2"/><line x1="12" y1="15" x2="12" y2="22" strokeWidth="2"/><line x1="12" y1="9" x2="14" y2="7"/><path d="M9 22h6"/></IconBase>),
            Roughness: () => (<IconBase size={36} className="text-gray-700"><path d="M3 12l2-2 2 4 2-6 2 8 2-4 2 2" strokeWidth="2"/><rect x="2" y="16" width="20" height="4"/></IconBase>),
            Bench: () => (<IconBase size={36} className="text-gray-700"><rect x="2" y="14" width="20" height="6" strokeWidth="2"/><path d="M4 14v-4h2"/><path d="M20 14v-4h-2"/><line x1="6" y1="12" x2="18" y2="12" strokeDasharray="2 2"/></IconBase>),
            MMT: () => (<IconBase size={36} className="text-gray-700"><path d="M4 20h16"/><path d="M8 20v-8"/><path d="M16 20v-8"/><path d="M8 12h8"/><line x1="12" y1="12" x2="12" y2="6"/><circle cx="12" cy="5" r="1"/></IconBase>)
        };

        const Icons = {
            Ruler: (props) => <IconBase {...props}><path d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.41 2.41 0 0 1 0-3.4l2.6-2.6a2.41 2.41 0 0 1 3.4 0Z"/><path d="m14.5 12.5 2-2"/><path d="m11.5 9.5 2-2"/></IconBase>,
            Search: (props) => <IconBase {...props}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></IconBase>,
            AlertTriangle: (props) => <IconBase {...props}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></IconBase>,
            CheckCircle: (props) => <IconBase {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></IconBase>,
            XCircle: (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></IconBase>,
            Info: (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></IconBase>,
            ArrowRight: (props) => <IconBase {...props}><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></IconBase>,
            ArrowLeft: (props) => <IconBase {...props}><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></IconBase>,
            Printer: (props) => <IconBase {...props}><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></IconBase>,
            RotateCcw: (props) => <IconBase {...props}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></IconBase>,
            Eye: (props) => <IconBase {...props}><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></IconBase>,
            EyeOff: (props) => <IconBase {...props}><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></IconBase>,
            Target: (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></IconBase>,
            List: (props) => <IconBase {...props}><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></IconBase>,
            ClipboardCheck: (props) => <IconBase {...props}><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/><polyline points="14 13 16 15 20 11"/></IconBase>,
            Scale: (props) => <IconBase {...props}><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></IconBase>,
            BarChart: (props) => <IconBase {...props}><line x1="12" y1="20" x2="12" y2="10" /><line x1="18" y1="20" x2="18" y2="4" /><line x1="6" y1="20" x2="6" y2="16" /></IconBase>,
            X: (props) => <IconBase {...props}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></IconBase>,
            Blueprint: (props) => <IconBase {...props}><path d="M4 22h14a2 2 0 0 0 2-2V7.5L14.5 2H6a2 2 0 0 0-2 2v4"/><polyline points="14 2 14 8 20 8"/><path d="M2 13h10"/><path d="M9 10l3 3-3 3"/></IconBase>
        };

        const { 
            Ruler, Search, AlertTriangle, CheckCircle, XCircle, Info, 
            ArrowRight, ArrowLeft, Printer, RotateCcw, Eye, EyeOff, Target, List, ClipboardCheck, Scale, BarChart, X, Blueprint
        } = Icons;

        // --- DONNÉES INSTRUMENTS ---
        const INSTRUMENTS_DB = [
            { id: 1, name: "Réglet", type: ["exterieur", "profondeur", "hauteur"], res: 0.5, u: 0.5, desc: "Pour ébauches seulement. Inadapté aux alésages.", icon: InstIcons.Ruler },
            { id: 2, name: "Pied à coulisse (Vernier)", type: ["exterieur", "interieur", "profondeur", "hauteur"], res: 0.05, u: 0.05, desc: "Le couteau suisse de l'atelier.", icon: InstIcons.Caliper },
            { id: 10, name: "Pied à coulisse à cadran", type: ["exterieur", "interieur", "profondeur", "hauteur"], res: 0.02, u: 0.02, desc: "Lecture analogique précise.", icon: InstIcons.Caliper },
            { id: 3, name: "Pied à coulisse (Digital)", type: ["exterieur", "interieur", "profondeur", "hauteur"], res: 0.01, u: 0.02, desc: "Polyvalent, lecture facile, attention au zéro.", icon: InstIcons.Caliper },
            { id: 4, name: "Micromètre digital", type: ["exterieur"], res: 0.001, u: 0.003, desc: "La référence pour les diamètres et épaisseurs précis.", icon: InstIcons.Micrometer },
            { id: 6, name: "Jauge de profondeur micrométrique", type: ["profondeur"], res: 0.001, u: 0.005, desc: "Précision sur les profondeurs et épaulements.", icon: InstIcons.DepthGauge },
            { id: 7, name: "Comparateur vertical", type: ["hauteur", "exterieur"], res: 0.001, u: 0.002, desc: "Pour mesurer par comparaison (hauteur, transfert).", icon: InstIcons.Comparator },
            { id: 8, name: "Banc de mesure", type: ["exterieur", "interieur"], res: 0.0001, u: 0.0015, desc: "Haute précision en laboratoire ou atelier.", icon: InstIcons.Bench },
            { id: 9, name: "MMT (Tridimensionnelle)", type: ["exterieur", "interieur", "hauteur", "angle", "profondeur"], res: 0.001, u: 0.001, desc: "Pour les géométries complexes.", icon: InstIcons.MMT }
        ];

        // --- COMPOSANTS UI ---

        const ComparisonBadge = ({ val, target, type }) => {
            const isOk = val <= target;
            return (
                <div className={`flex flex-col items-center justify-center p-2 rounded border ${isOk ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}`}>
                    <div className="text-[10px] uppercase text-gray-500 font-bold">{type}</div>
                    <div className={`font-mono font-bold ${isOk ? 'text-green-700' : 'text-red-700'}`}>
                         {val} 
                    </div>
                    <div className="text-[10px] text-gray-400 border-t border-gray-200 w-full text-center mt-1 pt-1">
                        Obj &lt; {target.toFixed(5)}
                    </div>
                </div>
            );
        };

        const VisualizerSVG = ({ u, it, nominal = 0 }) => {
            const nom = parseFloat(nominal) || 0;
            const width = 600; 
            const height = 180; // Hauteur légèrement augmentée pour espacer
            
            // Logique FIXE pour la Tolérance
            const fixedITWidth = width * 0.6; 
            const scale = fixedITWidth / it; 
            
            const centerX = width / 2;
            const tStart = centerX - (fixedITWidth / 2);
            const tEnd = centerX + (fixedITWidth / 2);
            
            // Incertitude U
            const uWidth = (u * 2) * scale;
            const uStart = centerX - (uWidth / 2);
            const uEnd = centerX + (uWidth / 2);

            const tMin = nom - (it/2);
            const tMax = nom + (it/2);
            const uMin = nom - u;
            const uMax = nom + u;
            const ratioPct = (u / it) * 100;
            const marginPct = (100 - (2 * ratioPct)) / 2;

            // Logique anti-chevauchement améliorée
            // On calcule si uStart est trop proche de centerX
            const textClearance = 40; // pixels min between labels
            const uTooSmall = uWidth < 80; // Si barre U très petite, on décale les labels

            return (
                <div className="w-full mt-2 bg-white rounded-lg border border-gray-100 p-2 overflow-hidden">
                    <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-auto font-mono">
                        {/* Center Axis (Nominal) */}
                        <line x1={centerX} y1={10} x2={centerX} y2={165} stroke="#ef4444" strokeWidth="1" strokeDasharray="4 2" />
                        <text x={centerX} y={175} textAnchor="middle" fontSize="10" fill="#ef4444" fontWeight="bold">Nominal</text>

                        {/* --- TOLERANCE ZONE (Gray, Bottom) --- */}
                        <rect x={tStart} y={100} width={fixedITWidth} height={35} fill="#e5e7eb" stroke="#9ca3af" strokeWidth="1" rx="2" />
                        <text x={centerX} y={122} textAnchor="middle" fontSize="12" fill="#4b5563" fontWeight="bold">Zone Tolérance (IT)</text>
                        
                        {/* Limits T */}
                        <line x1={tStart} y1={100} x2={tStart} y2={145} stroke="#4b5563" strokeWidth="1" strokeDasharray="2 2" opacity="0.6"/>
                        <text x={tStart} y={155} textAnchor="middle" fontSize="11" fontWeight="bold" fill="#4b5563">{tMin.toFixed(3)}</text>
                        
                        <line x1={tEnd} y1={100} x2={tEnd} y2={145} stroke="#4b5563" strokeWidth="1" strokeDasharray="2 2" opacity="0.6"/>
                        <text x={tEnd} y={155} textAnchor="middle" fontSize="11" fontWeight="bold" fill="#4b5563">{tMax.toFixed(3)}</text>

                        {/* --- UNCERTAINTY ZONE (Blue, Top) --- */}
                        <rect x={uStart} y={40} width={uWidth} height={35} fill="#bfdbfe" stroke="#3b82f6" strokeWidth="2" rx="2" fillOpacity="0.6" />
                        
                        {/* Texte Ratio dans la barre bleue (si assez large) ou au dessus */}
                        {uWidth > 120 ? (
                            <text x={centerX} y={62} textAnchor="middle" fontSize="11" fill="#1e40af" fontWeight="bold">Incertitude U (Ratio {ratioPct.toFixed(1)}%)</text>
                        ) : (
                            <text x={centerX} y={35} textAnchor="middle" fontSize="11" fill="#1e40af" fontWeight="bold">Incertitude U (Ratio {ratioPct.toFixed(1)}%)</text>
                        )}

                        {/* Limits U - Anti-overlap Logic */}
                        {/* Min U Label */}
                        <line x1={uStart} y1={40} x2={uStart} y2={85} stroke="#3b82f6" strokeWidth="1" strokeDasharray="2 2" opacity="0.5"/>
                        <text 
                            x={uStart} 
                            y={25} 
                            textAnchor={uTooSmall ? "end" : "middle"} 
                            dx={uTooSmall ? -5 : 0}
                            fontSize="11" fontWeight="bold" fill="#1e40af"
                        >
                            {uMin.toFixed(4)}
                        </text>
                        
                        {/* Max U Label */}
                        <line x1={uEnd} y1={40} x2={uEnd} y2={85} stroke="#3b82f6" strokeWidth="1" strokeDasharray="2 2" opacity="0.5"/>
                        <text 
                            x={uEnd} 
                            y={25} 
                            textAnchor={uTooSmall ? "start" : "middle"} 
                            dx={uTooSmall ? 5 : 0}
                            fontSize="11" fontWeight="bold" fill="#1e40af"
                        >
                            {uMax.toFixed(4)}
                        </text>

                        {/* Marge de conformité (Gris clair, alignée verticalement avec U) */}
                        {marginPct > 0 && (
                            <>
                                <text x={tStart + (uStart - tStart)/2} y={60} textAnchor="middle" fontSize="10" fill="#9ca3af">~{marginPct.toFixed(1)}%</text>
                                <text x={uEnd + (tEnd - uEnd)/2} y={60} textAnchor="middle" fontSize="10" fill="#9ca3af">~{marginPct.toFixed(1)}%</text>
                            </>
                        )}

                    </svg>
                </div>
            );
        };

        const ConformityVisualizerSVG = ({ u, it, nominal = 0 }) => {
            const nom = parseFloat(nominal) || 0;
            const tHalf = it / 2;
            const tMin = nom - tHalf;
            const tMax = nom + tHalf;
            const width = 600;
            const height = 100;
            const barY = 40;
            const barH = 30;
            const drawSpan = it / 0.7; 
            const drawMin = nom - (drawSpan/2);
            const toX = (val) => ((val - drawMin) / drawSpan) * width;
            const greenStart = tMin + u;
            const greenEnd = tMax - u;
            const hasGreen = greenEnd > greenStart;

            return (
                <div className="w-full mt-2 bg-white rounded-lg border border-gray-100 p-2 overflow-hidden">
                    <h4 className="text-xs font-bold text-gray-500 uppercase tracking-widest mb-2 text-center">Visualisation des Zones de Conformité</h4>
                    <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-auto font-mono">
                        <rect x="0" y={barY} width={toX(tMin)} height={barH} fill="#fecaca" />
                        <text x={toX(tMin)/2} y={barY+20} textAnchor="middle" fontSize="10" fill="#991b1b">Non-Conf.</text>
                        <rect x={toX(tMin)} y={barY} width={toX(tMin+u) - toX(tMin)} height={barH} fill="#fed7aa" />
                        {hasGreen ? (
                            <>
                                <rect x={toX(greenStart)} y={barY} width={toX(greenEnd) - toX(greenStart)} height={barH} fill="#dcfce7" />
                                <text x={toX(nom)} y={barY+20} textAnchor="middle" fontSize="10" fontWeight="bold" fill="#166534">CONFORME</text>
                            </>
                        ) : (
                            <rect x={toX(tMin+u)} y={barY} width={toX(tMax-u) - toX(tMin+u)} height={barH} fill="#fed7aa" />
                        )}
                        <rect x={toX(tMax-u)} y={barY} width={toX(tMax) - toX(tMax-u)} height={barH} fill="#fed7aa" />
                        <rect x={toX(tMax)} y={barY} width={width - toX(tMax)} height={barH} fill="#fecaca" />
                        <text x={toX(tMax) + (width - toX(tMax))/2} y={barY+20} textAnchor="middle" fontSize="10" fill="#991b1b">Non-Conf.</text>
                        <line x1={toX(tMin)} y1={barY-10} x2={toX(tMin)} y2={barY+barH+10} stroke="#333" strokeWidth="2" />
                        <text x={toX(tMin)} y={barY-15} textAnchor="middle" fontSize="10" fontWeight="bold">T min</text>
                        <line x1={toX(tMax)} y1={barY-10} x2={toX(tMax)} y2={barY+barH+10} stroke="#333" strokeWidth="2" />
                        <text x={toX(tMax)} y={barY-15} textAnchor="middle" fontSize="10" fontWeight="bold">T max</text>
                        <text x={toX(tMin + u/2)} y={barY+barH+15} textAnchor="middle" fontSize="9" fill="#c2410c">Doute</text>
                        <text x={toX(tMax - u/2)} y={barY+barH+15} textAnchor="middle" fontSize="9" fill="#c2410c">Doute</text>
                    </svg>
                    <div className="text-center text-[10px] text-gray-500 mt-2">
                        { !hasGreen && <div className="text-red-500 font-bold mt-1">⚠️ ATTENTION : Incertitude trop grande, aucune zone de conformité garantie !</div>}
                    </div>
                </div>
            );
        };

        const AllInstrumentsVisualizer = ({ instruments, it, targetU }) => {
            const width = 800;
            const barHeight = 25;
            const gap = 15;
            const totalHeight = instruments.length * (barHeight + gap) + 60;
            const centerX = width / 2;
            
            const maxU = Math.max(...instruments.map(i => i.u));
            const maxSpan = Math.max(it, maxU * 2.2); 
            
            const drawWidth = width * 0.9; 
            const scale = drawWidth / maxSpan;
            
            const visualITWidth = it * scale;
            const tStart = centerX - (visualITWidth / 2);

            return (
                <div className="w-full overflow-x-auto">
                    <svg viewBox={`0 0 ${width} ${totalHeight}`} className="w-full h-auto font-mono bg-white" style={{minWidth: '600px'}}>
                        <rect x={tStart} y={0} width={visualITWidth} height={totalHeight} fill="#f3f4f6" opacity="0.5" />
                        <line x1={tStart} y1={0} x2={tStart} y2={totalHeight} stroke="#9ca3af" strokeDasharray="4 2" />
                        <line x1={centerX + (visualITWidth/2)} y1={0} x2={centerX + (visualITWidth/2)} y2={totalHeight} stroke="#9ca3af" strokeDasharray="4 2" />
                        
                        {instruments.map((inst, i) => {
                            const uWidth = (inst.u * 2) * scale;
                            const uStart = centerX - (uWidth / 2);
                            const y = i * (barHeight + gap) + 10;
                            const isOk = inst.u <= targetU;
                            const ratio = (inst.u / it) * 100;
                            
                            return (
                                <g key={inst.id}>
                                    <text x={10} y={y + 15} fontSize="11" fill="#374151" fontWeight="bold">{inst.name}</text>
                                    <rect 
                                        x={uStart} 
                                        y={y} 
                                        width={uWidth} 
                                        height={barHeight} 
                                        fill={isOk ? "#86efac" : "#fca5a5"} 
                                        stroke={isOk ? "#16a34a" : "#dc2626"}
                                        rx="4"
                                    />
                                    <text x={width - 80} y={y + 16} fontSize="10" fill="#374151">Ratio: {ratio.toFixed(1)}%</text>
                                    <text x={centerX} y={y + 16} textAnchor="middle" fontSize="10" fill={isOk ? "#064e3b" : "#7f1d1d"}>
                                        ±{inst.u}
                                    </text>
                                </g>
                            )
                        })}
                        
                        <text x={centerX} y={totalHeight - 10} textAnchor="middle" fontSize="12" fontWeight="bold" fill="#4b5563">Zone de Tolérance (Gris)</text>
                    </svg>
                </div>
            );
        };

        const BlueprintSVG = () => (
            <div className="w-full h-48 bg-white border border-gray-200 rounded-lg flex items-center justify-center mb-6 relative overflow-hidden shadow-sm">
                <svg viewBox="0 0 400 160" className="w-full h-full">
                    <pattern id="hatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
                        <line x1="0" y1="0" x2="0" y2="10" style={{stroke:'#e2e8f0', strokeWidth:2}} />
                    </pattern>
                    
                    {/* Part Body */}
                    <rect x="50" y="60" width="300" height="60" fill="url(#hatch)" stroke="#334155" strokeWidth="2" />
                    
                    {/* Extension Lines */}
                    <line x1="50" y1="60" x2="50" y2="20" stroke="#334155" strokeWidth="1" />
                    <line x1="350" y1="60" x2="350" y2="20" stroke="#334155" strokeWidth="1" />
                    
                    {/* Dimension Line */}
                    <line x1="50" y1="30" x2="350" y2="30" stroke="#334155" strokeWidth="1.5" />
                    
                    {/* Arrows */}
                    <path d="M50 30 L60 27 L60 33 Z" fill="#334155" />
                    <path d="M350 30 L340 27 L340 33 Z" fill="#334155" />
                    
                    {/* Text Label */}
                    <rect x="140" y="18" width="120" height="24" fill="white" />
                    <text x="200" y="35" textAnchor="middle" fontSize="14" fill="#334155" fontWeight="bold" fontFamily="monospace">Nominal ± Tolérance</text>
                </svg>
                <div className="absolute bottom-2 right-2 text-[10px] text-gray-400 font-mono border px-1 rounded">REF: PLAN_001</div>
            </div>
        );

        const CpcInfoModal = ({ onClose }) => (
            <div className="modal-overlay" onClick={onClose}>
                <div className="modal-content" onClick={e => e.stopPropagation()}>
                    <div className="flex justify-between items-center mb-6 border-b pb-4">
                        <div>
                            <h3 className="text-2xl font-bold text-[var(--primary)] flex items-center gap-2">
                                <Info className="text-[var(--accent)]" /> Référentiel Capabilité (Cpc)
                            </h3>
                            <p className="text-sm text-gray-500 mt-1">Incertitudes et Capabilités des Instruments de Mesure (CIM)</p>
                        </div>
                        <button onClick={onClose} className="p-2 hover:bg-gray-100 rounded-full transition"><X size={24}/></button>
                    </div>
                    
                    <div className="space-y-4">
                        <div className="flex gap-4 items-start p-4 bg-red-50 border-l-4 border-red-500 rounded-r-lg">
                            <div className="font-bold text-red-700 whitespace-nowrap min-w-[120px]">Capabilité &lt; 3</div>
                            <div>
                                <div className="font-bold text-gray-800">Non respectée (Risque majeur)</div>
                                <div className="text-sm text-gray-600">Instrument de mesure non adapté.</div>
                            </div>
                        </div>

                        <div className="flex gap-4 items-start p-4 bg-orange-50 border-l-4 border-orange-400 rounded-r-lg">
                            <div className="font-bold text-orange-700 whitespace-nowrap min-w-[120px]">Capabilité 3 - 5</div>
                            <div>
                                <div className="font-bold text-gray-800">Risque acceptable</div>
                            </div>
                        </div>

                        <div className="flex gap-4 items-start p-4 bg-yellow-50 border-l-4 border-yellow-400 rounded-r-lg">
                            <div className="font-bold text-yellow-700 whitespace-nowrap min-w-[120px]">Capabilité = 5</div>
                            <div>
                                <div className="font-bold text-gray-800">Cas particulier PAC Digital</div>
                                <div className="text-sm text-gray-600">Si le PAC digital démontre une incertitude de mesure pratique de +/- 0.01 mm (Risque acceptable).</div>
                            </div>
                        </div>

                        <div className="flex gap-4 items-start p-4 bg-blue-50 border-l-4 border-blue-400 rounded-r-lg">
                            <div className="font-bold text-blue-700 whitespace-nowrap min-w-[120px]">Capabilité 6 - 9</div>
                            <div>
                                <div className="font-bold text-gray-800">Risque mineur</div>
                            </div>
                        </div>

                        <div className="flex gap-4 items-start p-4 bg-green-50 border-l-4 border-green-500 rounded-r-lg">
                            <div className="font-bold text-green-700 whitespace-nowrap min-w-[120px]">Capabilité &ge; 10</div>
                            <div>
                                <div className="font-bold text-gray-800">Respectée (Risque maîtrisé)</div>
                                <div className="text-sm text-gray-600">L'instrument de mesure est 10 x plus précis que la cote à mesurer.</div>
                            </div>
                        </div>
                    </div>

                   
                </div>
            </div>
        );

        const App = () => {
            const [step, setStep] = useState(0); 
            const [mode, setMode] = useState(null);
            const [showCompareModal, setShowCompareModal] = useState(false);
            const [showConformity, setShowConformity] = useState(false); // DEFAULT FALSE
            const [showCpcInfo, setShowCpcInfo] = useState(false);
            const [cpcDisplayMode, setCpcDisplayMode] = useState('both');
            
            const [data, setData] = useState({
                measureType: 'exterieur', 
                nominal: '',
                toleranceMode: 'pm', 
                tolPlus: '',
                tolMinus: '',
                tolMin: '',
                tolMax: '',
                isCritical: false,
                conditions: { access: true, scratchRisk: false, speed: false },
                selectedInstId: null,
                checklist: { clean: false, noShock: false, zero: false, fluid: false, standard: false, date: false }
            });

            // Calculs
            const IT = useMemo(() => {
                if (data.toleranceMode === 'pm') {
                    const p = parseFloat(data.tolPlus) || 0;
                    const m = parseFloat(data.tolMinus) || 0;
                    return Math.abs(p) + Math.abs(m);
                } else {
                    const max = parseFloat(data.tolMax) || 0;
                    const min = parseFloat(data.tolMin) || 0;
                    return Math.abs(max - min);
                }
            }, [data.toleranceMode, data.tolPlus, data.tolMinus, data.tolMin, data.tolMax]);

            const targetU = useMemo(() => {
                if (data.isCritical) return IT / 10;
                return IT / 3;
            }, [IT, data.isCritical]);
            
            const targetRes = IT / 10;

            const recommendations = useMemo(() => {
                if (!IT || IT === 0) return [];
                let candidates = INSTRUMENTS_DB; 
                return candidates.map(inst => {
                    const ratioR = IT / inst.res;
                    let statusR = "ko", msgR = "Résolution Insuffisante";
                    if (ratioR >= 10) { statusR = "ok"; msgR = "Optimale"; }
                    else if (ratioR >= 5) { statusR = "warn"; msgR = "Limite"; }
                    
                    let statusU = "ko", msgU = "Non fiable";
                    let score = 0;

                    if (inst.u <= targetU) { statusU = "ok"; msgU = "Conforme"; score = 2; } 
                    else if (inst.u <= (targetU * 1.5)) { statusU = "warn"; msgU = "Limite"; score = 1; }

                    if (statusR === 'ok') score += 2; else if (statusR === 'warn') score += 1;
                    
                    // CPC Calculation (IT / 2u)
                    const cpc = IT / (2 * inst.u);
                    const ratioPct = (inst.u / IT) * 100;
                    let cpcStatus = { color: "text-red-600 bg-red-50 border-red-200", label: "Risque Majeur" };
                    if (cpc >= 10) cpcStatus = { color: "text-green-700 bg-green-50 border-green-200", label: "Maîtrisé" };
                    else if (cpc >= 6) cpcStatus = { color: "text-blue-700 bg-blue-50 border-blue-200", label: "Mineur" };
                    else if (cpc >= 3) cpcStatus = { color: "text-orange-700 bg-orange-50 border-orange-200", label: "Acceptable" };

                    return { ...inst, statusR, msgR, statusU, msgU, score, cpc, cpcStatus, ratioPct };
                }).sort((a, b) => b.score - a.score);
            }, [data.measureType, IT, data.isCritical, mode, targetU]);

            // Auto-select first recommended inst
            useEffect(() => {
                if(step === 3 && recommendations.length > 0 && !data.selectedInstId) {
                    setData(d => ({...d, selectedInstId: recommendations[0].id}));
                }
            }, [step, recommendations]);

            // NAVIGATION
            const nextStep = () => {
                if (step === 1 && mode === 'tolerance') setStep(3);
                else setStep(s => s + 1);
            };
            const prevStep = () => {
                if (step === 1) setStep(0);
                else if (step === 4 && mode === 'checklist') { setStep(0); setMode(null); }
                else if (step === 3 && mode === 'tolerance') setStep(1);
                else setStep(s => s - 1);
            };
            const restart = () => {
                setStep(0); setMode(null);
                setData(prev => ({...prev, checklist: { clean:false, noShock:false, zero:false, fluid:false, standard:false, date:false }, selectedInstId: null}));
            };
            
            const startToleranceFlow = () => { setMode('tolerance'); setStep(1); };
            const startChecklist = () => { setMode('checklist'); setData(prev => ({...prev, checklist: { clean:false, noShock:false, zero:false, fluid:false, standard:false, date:false }})); setStep(4); };

            const Header = ({ title }) => (
                <div className="mb-6 flex items-center justify-between no-print">
                    <div>
                        <a href="index.html" className="flex items-center gap-1 text-xs font-bold text-gray-400 hover:text-[var(--primary)] mb-1 w-fit no-underline">
                            <ArrowLeft size={14} /> Accueil
                        </a>
                        <h1 className="text-3xl font-bold tracking-tight text-[var(--primary)]">{title}</h1>
                        <span className="text-xs font-bold uppercase text-[var(--accent-text)] bg-[var(--accent-light)] px-3 py-1 rounded-full border border-[var(--accent)]">
                            {mode === 'checklist' ? 'Vérification' : mode === 'tolerance' && step === 3 ? 'Résultats & Analyse' : `Étape ${step}/3`}
                        </span>
                        {step === 3 && (
                            <div className="mt-2 text-sm text-gray-500 font-mono flex gap-4">
                                <span>Cible : {data.nominal} {data.toleranceMode === 'pm' ? `±${Math.abs(data.tolPlus)}` : `[${data.tolMin};${data.tolMax}]`}</span>
                                <span className="font-bold text-[var(--primary)]">IT : {IT.toFixed(3)} mm</span>
                            </div>
                        )}
                    </div>
                    {step === 3 && mode === 'tolerance' && (
                        <div className="flex gap-2">
                            <button onClick={restart} className="text-sm font-bold text-gray-500 hover:text-[var(--primary)] flex items-center gap-1"><RotateCcw size={14}/> Nouveau</button>
                            <button onClick={() => window.print()} className="bg-[var(--primary)] text-white px-4 py-2 rounded font-bold flex items-center gap-2 hover:bg-gray-800"><Printer size={16}/> Imprimer</button>
                        </div>
                    )}
                </div>
            );

            // 0. HOME
            if (step === 0) return (
                <div className="game-container">
                    <div className="absolute top-4 left-4 z-10">
                        <a href="index.html" className="flex items-center gap-2 text-gray-500 hover:text-[var(--primary)] font-bold transition-colors no-underline"><ArrowLeft size={20} /> Accueil</a>
                    </div>
                    <div className="step-transition h-full">
                        <div className="text-center mb-6">
                            <h1 className="text-4xl font-black text-[var(--primary)] tracking-tight mb-2 uppercase">Laboratoire de Métrologie</h1>
                            <p className="text-gray-500 text-lg">Sélectionnez votre mode d'analyse</p>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                            <button onClick={startToleranceFlow} className="p-6 rounded-xl bg-[var(--primary)] text-white hover:scale-[1.02] transition shadow-xl border-2 border-transparent hover:border-[var(--accent)] text-left group flex flex-col justify-between h-64 relative overflow-hidden">
                                <div className="absolute -right-6 -top-6 text-[var(--accent)] opacity-10"><Target size={150} /></div>
                                <div>
                                    <div className="mb-4 text-[var(--accent)]"><Target size={40} /></div>
                                    <h3 className="text-2xl font-bold mb-2 uppercase">Analyse par Tolérance</h3>
                                    <p className="text-base opacity-70">Je veux vérifier si mon instrument est assez <strong>précis</strong> (calcul d'incertitude).</p>
                                </div>
                                <div className="flex items-center gap-2 font-bold text-[var(--accent)] mt-4">Commencer <ArrowRight size={20} className="group-hover:translate-x-1 transition" /></div>
                            </button>
                            <button onClick={startChecklist} className="p-6 rounded-xl bg-[var(--accent-light)] text-[var(--accent-text)] hover:scale-[1.02] transition shadow-xl border-2 border-[var(--accent)] text-left group flex flex-col justify-between h-64 relative overflow-hidden">
                                <div className="absolute -right-6 -top-6 text-[var(--accent)] opacity-20"><ClipboardCheck size={150} /></div>
                                <div>
                                    <div className="mb-4"><ClipboardCheck size={40} /></div>
                                    <h3 className="text-2xl font-bold mb-2 uppercase">Check-list Démarrage</h3>
                                    <p className="text-base opacity-80">Vérification de l'<strong>instrument</strong> avant mesure.</p>
                                </div>
                                <div className="flex items-center gap-2 font-bold mt-4">Vérifier <ArrowRight size={20} className="group-hover:translate-x-1 transition" /></div>
                            </button>
                        </div>
                    </div>
                </div>
            );

            // 1. DÉFINITION
            if (step === 1) return (
                <div className="game-container">
                    <div className="step-transition">
                        <Header title="Définition de la mesure" />
                        <div className="flex-1 space-y-8">
                            <BlueprintSVG />
                            <div className="grid grid-cols-2 gap-6 items-end">
                                <div>
                                    <label className="block text-sm font-bold text-[var(--text-color)] mb-2 uppercase tracking-wide">Nominal (mm)</label>
                                    <input type="number" className="w-full p-3 rounded-lg input-tech text-lg h-[50px]" placeholder="20.00" value={data.nominal} onChange={(e) => setData({...data, nominal: e.target.value})} />
                                </div>
                                <div>
                                    <div className="flex justify-between items-center mb-2">
                                        <label className="block text-sm font-bold text-[var(--text-color)] uppercase tracking-wide">Tolérance</label>
                                        <div className="flex items-center bg-[var(--bg-color)] rounded-lg border border-[var(--border-color)] p-1 scale-90 origin-right">
                                            <button onClick={() => setData({...data, toleranceMode: 'pm'})} className={`px-2 py-1 text-xs font-bold rounded transition-all ${data.toleranceMode === 'pm' ? 'bg-[var(--accent)] text-white shadow' : 'text-gray-500 hover:text-gray-700'}`}>±</button>
                                            <div className="w-px h-3 bg-gray-300 mx-1"></div>
                                            <button onClick={() => setData({...data, toleranceMode: 'minmax'})} className={`px-2 py-1 text-xs font-bold rounded transition-all ${data.toleranceMode === 'minmax' ? 'bg-[var(--accent)] text-white shadow' : 'text-gray-500 hover:text-gray-700'}`}>Min/Max</button>
                                        </div>
                                    </div>
                                    {data.toleranceMode === 'pm' ? (
                                        <div className="flex gap-2 items-center h-[50px]"><span className="font-bold text-[var(--primary)] text-xl">±</span><input type="number" placeholder="0.1" className="w-full p-3 rounded-lg input-tech text-lg h-full" value={data.tolPlus} onChange={(e) => setData({...data, tolPlus: e.target.value, tolMinus: e.target.value})} /></div>
                                    ) : (
                                        <div className="flex gap-2 h-[50px]"><input type="number" placeholder="Min" className="w-1/2 p-3 rounded-lg input-tech h-full" value={data.tolMin} onChange={(e) => setData({...data, tolMin: e.target.value})} /><input type="number" placeholder="Max" className="w-1/2 p-3 rounded-lg input-tech h-full" value={data.tolMax} onChange={(e) => setData({...data, tolMax: e.target.value})} /></div>
                                    )}
                                </div>
                            </div>
                            <div className="mt-6">
                                <div className="flex justify-between items-center mb-3">
                                    <label className="block text-sm font-bold text-[var(--text-color)] uppercase tracking-wide">Niveau de Criticité</label>
                                    {IT > 0 && <div className="text-xs bg-gray-100 px-3 py-1 rounded-full font-mono font-bold text-gray-600">IT : {IT.toFixed(3)} mm</div>}
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div onClick={() => setData({...data, isCritical: false})} className={`p-4 rounded-lg border-2 cursor-pointer transition-all flex flex-col justify-between ${!data.isCritical ? 'border-[var(--accent)] bg-yellow-50 shadow-md ring-1 ring-[var(--accent)]' : 'border-gray-200 bg-white hover:border-gray-300 hover:bg-gray-50'}`}>
                                        <div><div className="font-bold text-[var(--primary)] flex items-center gap-2"><div className={`w-4 h-4 rounded-full border ${!data.isCritical ? 'bg-[var(--accent)] border-[var(--accent)]' : 'bg-white border-gray-400'}`}></div>Cote Non Critique</div><div className="text-xs text-gray-500 mt-1 pl-6">Standard / Esthétique</div></div>
                                        <div className="mt-3 pl-6"><div className="inline-block px-2 py-1 bg-blue-100 text-blue-800 text-xs font-bold rounded">Règle du 1 sur 3</div><div className="text-[10px] text-gray-400 mt-1">U ≤ IT / 3</div></div>
                                    </div>
                                    <div onClick={() => setData({...data, isCritical: true})} className={`p-4 rounded-lg border-2 cursor-pointer transition-all flex flex-col justify-between ${data.isCritical ? 'border-[var(--danger)] bg-red-50 shadow-md ring-1 ring-[var(--danger)]' : 'border-gray-200 bg-white hover:border-gray-300 hover:bg-gray-50'}`}>
                                        <div><div className="font-bold text-[var(--danger)] flex items-center gap-2"><div className={`w-4 h-4 rounded-full border ${data.isCritical ? 'bg-[var(--danger)] border-[var(--danger)]' : 'bg-white border-gray-400'}`}></div>Cote Critique</div><div className="text-xs text-gray-500 mt-1 pl-6">Sécurité / Ajustement</div></div>
                                        <div className="mt-3 pl-6"><div className="inline-block px-2 py-1 bg-red-100 text-red-800 text-xs font-bold rounded">Règle du 1 sur 10</div><div className="text-[10px] text-gray-400 mt-1">U ≤ IT / 10</div></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div className="mt-8 flex gap-4">
                             <button onClick={prevStep} className="flex-1 py-4 rounded-lg btn-outline">Accueil</button>
                             <button onClick={nextStep} disabled={!IT || IT === 0} className="flex-[3] py-4 rounded-lg btn-gold flex items-center justify-center gap-2 shadow-md">Analyser Directement <ArrowRight size={20} /></button>
                        </div>
                    </div>
                </div>
            );

            // 3. TABLEAU DE BORD
            if (step === 3) {
                const instrument = recommendations.find(i => i.id === data.selectedInstId) || recommendations[0];
                const isRecommendationOk = instrument ? instrument.score >= 3 : false;
                
                // Calcul du ratio pour l'affichage
                const ratioPct = (instrument.u / IT) * 100;
                let conclusion = "";
                if (instrument.u <= targetU) conclusion = "Moyen adapté ✅";
                else if (instrument.u <= (targetU * 1.5)) conclusion = "Moyen limite ⚠️";
                else conclusion = "Moyen inadapté ❌";

                return (
                    <div className="game-container h-full relative">
                        <Header title="Analyse & Sélection" />
                        
                        {/* HEADER KPI */}
                        <div className="grid grid-cols-2 gap-4 mb-6 no-print">
                            <div className="bg-[var(--primary)] text-white p-4 rounded-lg shadow-inner relative group">
                                <button 
                                    onClick={() => setShowCpcInfo(true)} 
                                    className="absolute top-2 right-2 text-white/40 hover:text-[var(--accent)] transition p-1"
                                    title="Voir le référentiel Cpc"
                                >
                                    <Info size={18} />
                                </button>
                                <h3 className="text-[10px] uppercase font-bold opacity-70 mb-1">Cahier des charges (IT: {IT.toFixed(3)})</h3>
                                <div className="flex justify-between items-end">
                                    <span className={`text-xs block font-bold ${data.isCritical ? 'text-[var(--danger)]' : 'text-[var(--accent)]'}`}>{data.isCritical ? "Cible Critique (1/10)" : "Cible Standard (1/3)"}</span>
                                    <span className={`font-mono font-bold text-lg ${data.isCritical ? 'text-[var(--danger)]' : 'text-[var(--accent)]'}`}>&le; {targetU.toFixed(5)}</span>
                                </div>
                            </div>
                            <div className="bg-white border border-[var(--border-color)] p-4 rounded-lg flex flex-col justify-center items-start text-sm text-gray-500 relative">
                                <div className="absolute top-2 right-2 flex gap-2">
                                    <button onClick={() => setData(d => ({...d, isCritical: !d.isCritical}))} className="text-[10px] bg-gray-100 hover:bg-gray-200 px-2 py-1 rounded border border-gray-300">
                                        Basculer {data.isCritical ? "Standard" : "Critique"}
                                    </button>
                                </div>
                                <p className="mb-2 pr-12">{data.isCritical ? <span><strong className="text-[var(--danger)]">Règle 1/10 :</strong> Instrument très précis requis.</span> : <span><strong className="text-[var(--accent-text)]">Règle 1/3 :</strong> Précision standard suffisante.</span>}</p>
                                <button onClick={() => setShowCompareModal(true)} className="text-xs bg-gray-100 hover:bg-gray-200 px-3 py-1 rounded-full font-bold flex items-center gap-2 transition">
                                    <BarChart size={14}/> Comparer tous les moyens
                                </button>
                            </div>
                        </div>

                        {/* DASHBOARD GRID */}
                        <div className="flex flex-col md:flex-row gap-6 flex-1 min-h-0">
                            
                            {/* COLONNE GAUCHE: LISTE */}
                            <div className="w-full md:w-1/3 flex flex-col border rounded-lg bg-white overflow-hidden shadow-sm inst-list-col">
                                <div className="bg-gray-100 p-2 text-xs font-bold uppercase text-gray-500 border-b flex justify-between items-center">
                                    <span>Instruments</span>
                                    <div className="flex bg-white rounded border border-gray-300 overflow-hidden scale-90">
                                        <button onClick={() => setCpcDisplayMode('cpc')} className={`px-1.5 py-0.5 ${cpcDisplayMode==='cpc'?'bg-gray-200 text-black font-bold':'text-gray-400 hover:text-gray-600'}`}>CPC</button>
                                        <div className="w-px bg-gray-200"></div>
                                        <button onClick={() => setCpcDisplayMode('ratio')} className={`px-1.5 py-0.5 ${cpcDisplayMode==='ratio'?'bg-gray-200 text-black font-bold':'text-gray-400 hover:text-gray-600'}`}>%</button>
                                        <div className="w-px bg-gray-200"></div>
                                        <button onClick={() => setCpcDisplayMode('both')} className={`px-1.5 py-0.5 ${cpcDisplayMode==='both'?'bg-gray-200 text-black font-bold':'text-gray-400 hover:text-gray-600'}`}>Mix</button>
                                    </div>
                                </div>
                                <div className="flex-1 overflow-y-auto custom-scroll p-2 space-y-2">
                                    {recommendations.map((inst, idx) => (
                                        <div 
                                            key={inst.id} 
                                            onClick={() => setData({...data, selectedInstId: inst.id})}
                                            className={`inst-card p-3 rounded border cursor-pointer ${data.selectedInstId === inst.id ? 'selected' : 'border-transparent hover:border-gray-200'}`}
                                        >
                                            <div className="flex justify-between items-start">
                                                <div className="flex items-center gap-3">
                                                    <div className="text-gray-600 scale-75 origin-left">
                                                        <inst.icon />
                                                    </div>
                                                    <div>
                                                        <div className="font-bold text-sm text-[var(--primary)]">{inst.name}</div>
                                                        <div className="text-[10px] text-gray-500">U: ±{inst.u}</div>
                                                    </div>
                                                </div>
                                                <div className="flex flex-col items-end gap-1">
                                                    <div className={`w-3 h-3 rounded-full ${inst.statusU === 'ok' ? 'bg-green-500' : inst.statusU === 'warn' ? 'bg-orange-500' : 'bg-red-500'}`}></div>
                                                    <div className={`text-[9px] px-1.5 py-0.5 rounded border font-bold whitespace-nowrap ${inst.cpcStatus.color}`}>
                                                        {cpcDisplayMode !== 'ratio' && `Cpc ${inst.cpc.toFixed(1)}`}
                                                        {cpcDisplayMode === 'both' && <span className="opacity-40 mx-1">|</span>}
                                                        {cpcDisplayMode !== 'cpc' && `${inst.ratioPct.toFixed(1)}%`}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* COLONNE DROITE: FICHE DÉTAILLÉE */}
                            <div className="w-full md:w-2/3 bg-white border-2 border-[var(--primary)] rounded-lg p-6 relative overflow-hidden shadow-lg flex flex-col main-content-col print:border-none print:shadow-none print:p-0">
                                <div className="absolute top-0 right-0 p-4 opacity-5 pointer-events-none no-print"><Target size={120} /></div>

                                <div className="border-b-2 border-[var(--accent)] pb-4 mb-4 flex justify-between items-end">
                                    <div>
                                        <h2 className="text-2xl font-black text-[var(--primary)] uppercase tracking-tighter">Analyse Détaillée</h2>
                                        <div className="text-sm font-bold text-gray-600 mt-1">{instrument.name}</div>
                                    </div>
                                    <div className={`px-3 py-1 text-xs font-bold border uppercase tracking-widest ${isRecommendationOk ? 'border-green-500 text-green-600 bg-green-50' : 'border-red-500 text-red-600 bg-red-50'}`}>
                                        {isRecommendationOk ? "Adapté" : "Risqué"}
                                    </div>
                                </div>

                                <div className="flex-1 overflow-y-auto custom-scroll pr-2">
                                    <div className="bg-gray-50 p-4 rounded border mb-4">
                                        <div className="flex gap-8 text-sm font-mono text-gray-700 items-center">
                                            <div className="flex flex-col">
                                                <span className="text-[10px] text-gray-400 uppercase">Résolution</span>
                                                <strong>{instrument.res} mm</strong>
                                            </div>
                                            <div className="flex flex-col">
                                                <span className="text-[10px] text-gray-400 uppercase">Incertitude (U)</span>
                                                <strong>±{instrument.u} mm</strong>
                                            </div>
                                            <div className="flex flex-col border-l pl-4 border-gray-300">
                                                <span className="text-[10px] text-gray-400 uppercase">Ratio U/IT</span>
                                                <div className="flex items-center gap-2">
                                                    <strong className={`${ratioPct > 33 ? 'text-red-600' : 'text-green-600'}`}>{ratioPct.toFixed(1)}%</strong>
                                                    <span className="text-xs font-bold italic opacity-70"> - {conclusion}</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="space-y-6">
                                        <div>
                                            <h3 className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">1. Comparaison de l'incertitude du moyen de mesure par rapport à la tolérance</h3>
                                            <VisualizerSVG u={instrument.u} it={IT} nominal={data.nominal} />
                                        </div>
                                        <div>
                                            <div className="flex justify-between items-center mb-2">
                                                <h3 className="text-[10px] font-bold text-gray-400 uppercase tracking-widest">2. Zones de Conformité Réelles</h3>
                                                <button onClick={() => setShowConformity(!showConformity)} className="text-[10px] bg-gray-100 hover:bg-gray-200 px-2 py-1 rounded border border-gray-300 flex items-center gap-1 no-print">
                                                    {showConformity ? <Eye size={12} /> : <EyeOff size={12} />} 
                                                    {showConformity ? "Masquer" : "Afficher"}
                                                </button>
                                            </div>
                                            {showConformity && <ConformityVisualizerSVG u={instrument.u} it={IT} nominal={data.nominal} />}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* MODAL */}
                        {showCompareModal && (
                            <div className="modal-overlay" onClick={() => setShowCompareModal(false)}>
                                <div className="modal-content" onClick={e => e.stopPropagation()}>
                                    <div className="flex justify-between items-center mb-4 border-b pb-2">
                                        <h3 className="text-xl font-bold">Comparatif Global</h3>
                                        <button onClick={() => setShowCompareModal(false)} className="text-gray-500 hover:text-black"><X size={24}/></button>
                                    </div>
                                    <AllInstrumentsVisualizer instruments={recommendations} it={IT} targetU={targetU} />
                                </div>
                            </div>
                        )}

                        {/* MODAL CPC INFO */}
                        {showCpcInfo && <CpcInfoModal onClose={() => setShowCpcInfo(false)} />}

                        <div className="mt-4 flex gap-4 pt-4 border-t border-[var(--border-color)] no-print">
                            <button onClick={prevStep} className="px-6 py-2 rounded btn-outline">Retour Définition</button>
                        </div>
                    </div>
                );
            }

            // 4. CHECKLIST
            if (step === 4) return (
                <div className="game-container">
                    <div className="step-transition">
                        <Header title="Vérification Globale" />
                        <div className="flex-1 overflow-y-auto pr-2 max-h-[450px]">
                            {/* PARTIE ENVIRONNEMENT SUPPRIMÉE ICI */}
                            <div>
                                <h3 className="text-sm font-bold uppercase text-gray-500 mb-3 border-b pb-1">Contrôle de l'instrument</h3>
                                <div className="space-y-3">
                                    {[
                                        {k:'clean', l:"Nettoyer les surfaces", d:"Passer un chiffon sur les becs et la pièce pour éliminer huile et copeaux."},
                                        {k:'noShock', l:"Inspecter l'outil", d:"Vérifier l'absence de chocs, rayures ou bavures sur les touches de mesure."},
                                        {k:'fluid', l:"Tester la mécanique", d:"Le coulissement doit être fluide, gras et sans point dur."},
                                        {k:'zero', l:"Faire le zéro", d:"Fermer l'instrument et vérifier l'affichage à 0.00."},
                                        {k:'date', l:"Contrôler la validité", d:"L'étiquette d'étalonnage doit être présente et la date valide."},
                                        {k:'standard', l:"Valider sur étalon", d:"Mesurer une cale ou bague étalon pour confirmer la justesse."}
                                    ].map((item) => (
                                        <label key={item.k} className={`flex items-start gap-4 p-4 rounded-lg border-2 cursor-pointer transition-all ${data.checklist[item.k] ? 'border-[var(--success)] bg-green-50' : 'border-[var(--border-color)] hover:bg-gray-50'}`}>
                                            <div className={`mt-1 w-5 h-5 rounded flex items-center justify-center border-2 shrink-0 ${data.checklist[item.k] ? 'bg-[var(--success)] border-[var(--success)] text-white' : 'border-gray-300 bg-white'}`}>
                                                {data.checklist[item.k] && <CheckCircle size={14} />}
                                            </div>
                                            <input 
                                                type="checkbox" 
                                                className="hidden"
                                                checked={data.checklist[item.k]}
                                                onChange={(e) => setData({...data, checklist: {...data.checklist, [item.k]: e.target.checked}})}
                                            />
                                            <div>
                                                <span className={`font-bold text-sm block ${data.checklist[item.k] ? 'text-[var(--primary)]' : 'text-gray-700'}`}>{item.l}</span>
                                                <span className="text-xs text-gray-500">{item.d}</span>
                                            </div>
                                        </label>
                                    ))}
                                </div>
                            </div>
                        </div>
                        <div className="mt-6 flex gap-4 pt-4 border-t border-[var(--border-color)]">
                             <button onClick={prevStep} className="flex-1 py-3 rounded-lg btn-outline">Accueil</button>
                             <button onClick={() => { restart(); }} disabled={!Object.values(data.checklist).every(Boolean)} className="flex-[2] py-3 rounded-lg btn-gold shadow-lg disabled:opacity-50 disabled:cursor-not-allowed">{Object.values(data.checklist).every(Boolean) ? "Terminer" : "Valider les 6 points"}</button>
                        </div>
                    </div>
                </div>
            );

            return null;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
