                let nextSeq = (Math.floor(lastSequence) + 1).toString();

                const tm = parseFloat(tolMinus);
                const tp = parseFloat(tolPlus);
                if (isNaN(t)) return { min: '-', max: '-' };
                const min = !isNaN(tm) ? (t - Math.abs(tm)).toFixed(2) : '-';

                if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') {
                    e.preventDefault();
                    return;
                }
                setDraggedIndex(index);
                e.dataTransfer.effectAllowed = "move";
            };

            const onDragOver = (e, index) => {
                e.preventDefault();
            };

                e.preventDefault();
                if (draggedIndex === null || draggedIndex === index) return;

                            if (clonedEl) {
                                clonedEl.style.width = element.scrollWidth + "px";
                                const scrollables = clonedEl.querySelectorAll('.overflow-x-auto');
                                scrollables.forEach(el => el.style.overflow = 'visible');
                            }
                        }
                    });
                    const image = canvas.toDataURL("image/png");
                    const link = document.createElement('a');
                    link.href = image;
                    link.download = `gamme-${headerInfo.reference || 'export'}.png`;
                    link.click();
                } catch (err) {
                    console.error(err);
                    alert("Erreur lors de l'export image");
                }
            };

            return (
                <main className="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
                    <div className="flex justify-between items-center mb-6">
                        <div className="flex items-center gap-4">
                            <button onClick={onBack} className="p-2 rounded-full hover:bg-gray-200 transition-colors">
                                <ArrowLeft size={20} />
                            </button>
                            <h1 className="text-2xl font-bold" style={{ color: theme.primary }}>
                                {mode === 'create' ? 'Création de Gamme' : mode === 'run' ? 'Saisie des Mesures' : 'Édition de Gamme'}
                            </h1>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={handleExportPNG} className="flex items-center gap-2 px-4 py-2 bg-white border rounded-md shadow-sm text-gray-700 hover:bg-gray-50">
                                <Camera size={16} /> PNG
                            </button>
                            <button className="flex items-center gap-2 px-4 py-2 bg-white border rounded-md shadow-sm text-gray-700 hover:bg-gray-50">
                                <Printer size={16} /> Imprimer
                            </button>
                            {!isRunMode && (
                                <button className="flex items-center gap-2 px-4 py-2 text-white rounded-md shadow-sm transition-colors" style={{ backgroundColor: theme.success }}>
                                    <Save size={16} /> Enregistrer
                                </button>
                            )}
                            {isRunMode && (
                                <button className="flex items-center gap-2 px-4 py-2 text-white rounded-md shadow-sm transition-colors" style={{ backgroundColor: theme.primary }}>
                                    <CheckCircle size={16} /> Valider le contrôle
                                </button>
                            )}
                        </div>
                    </div>

                    <div id="gamme-capture-zone" className="bg-white shadow-lg rounded-lg border border-gray-200">
                        <div className="p-4 border-b border-gray-200">
                            <h3 className="text-md font-semibold text-gray-700 mb-4">En-tête de la gamme de contrôle</h3>
                            <div className="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-x-6 gap-y-4">
                                {[
                                    {key: 'designation', label: 'Désignation'},
                                    {key: 'reference', label: 'Référence'},
                                    {key: 'indice', label: 'Indice'},
                                    {key: 'controleur', label: 'Contrôleur'},
                                    {key: 'dateControle', label: 'Date du Contrôle', type: 'date'}
                                ].map((field) => (
                                    <div key={field.key}>
                                        <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">{field.label}</label>
                                        {isReadOnly ? (
                                            <p className="text-base font-semibold p-2 bg-gray-50 rounded-md" style={{ color: theme.primary }}>{headerInfo[field.key]}</p>
                                        ) : (
                                            <input
                                                type={field.type || 'text'}
                                                value={headerInfo[field.key]}
                                                onChange={(e) => setHeaderInfo({ ...headerInfo, [field.key]: e.target.value })}
                                                className="w-full rounded-md border border-gray-300 shadow-sm sm:text-sm p-2 focus:ring-yellow-500 focus:border-yellow-500"
                                            />
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="p-4">
                            <h3 className="text-md font-semibold text-gray-700 mb-4">Corps de la gamme de contrôle</h3>
                            <div className="overflow-x-auto">
                                <table className="min-w-full divide-y divide-gray-200">
                                    <thead className="bg-gray-50">
                                        <tr>
                                            {!isRunMode && <th className="w-10 px-3 py-3"></th>}
                                            <th className="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-16">Num</th>
                                            <th className="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Caractéristique</th>
                                            <th className="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-20">Cible</th>
                                            <th className="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-16">Tol -</th>
                                            <th className="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-16">Tol +</th>
                                            <th className="px-3 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider w-20 bg-gray-100 border-l border-gray-200">Lim Inf</th>
                                            <th className="px-3 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider w-20 bg-gray-100 border-r border-gray-200">Lim Sup</th>
                                            <th className="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-40">Instrument</th>
                                            {isRunMode && <th className="px-3 py-3 text-center text-xs font-bold uppercase tracking-wider w-32" style={{ color: theme.accentText, backgroundColor: theme.accentLight }}>Mesure</th>}
                                            {isRunMode && <th className="px-3 py-3 text-center text-xs font-bold uppercase tracking-wider w-32">Statut</th>}
                                            {!isRunMode && <th className="px-3 py-3 w-16"></th>}
                                        </tr>
                                    </thead>
                                    <tbody className="bg-white divide-y divide-gray-200">
                                        {measurements.map((row, index) => {
                                            const { min, max } = calculateLimits(row.target, row.tolMinus, row.tolPlus);
                                            
                                            return (
                                                <tr 
                                                    key={row.id}
                                                    draggable={!isRunMode}
                                                    onDragStart={(e) => onDragStart(e, index)}
                                                    onDragOver={(e) => onDragOver(e, index)}
                                                    onDrop={(e) => onDrop(e, index)}
                                                    className={!isRunMode ? "cursor-move hover:bg-gray-50 transition-colors" : ""}
                                                >
                                                    {!isRunMode && (
                                                        <td className="px-3 py-4 text-center text-gray-400">
                                                            <GripVertical size={16} />
                                                        </td>
                                                    )}
                                                    <td className="px-3 py-4"><input value={row.sequence} disabled={isReadOnly} onChange={(e) => handleTableChange(row.id, 'sequence', e.target.value)} className="w-full text-center font-mono text-sm border-none bg-transparent" /></td>
                                                    <td className="px-3 py-4"><input value={row.designation} disabled={isReadOnly} onChange={(e) => handleTableChange(row.id, 'designation', e.target.value)} className="w-full text-sm border-none bg-transparent" /></td>
                                                    <td className="px-3 py-4"><input value={row.target} disabled={isReadOnly} onChange={(e) => handleTableChange(row.id, 'target', e.target.value)} className="w-full text-right text-sm border-none bg-transparent" /></td>
                                                    <td className="px-3 py-4"><input value={row.tolMinus} disabled={isReadOnly} onChange={(e) => handleTableChange(row.id, 'tolMinus', e.target.value)} className="w-full text-right text-sm border-none bg-transparent text-red-600" placeholder="-" /></td>
                                                    <td className="px-3 py-4"><input value={row.tolPlus} disabled={isReadOnly} onChange={(e) => handleTableChange(row.id, 'tolPlus', e.target.value)} className="w-full text-right text-sm border-none bg-transparent text-green-600" placeholder="+" /></td>
                                                    
                                                    <td className="px-3 py-4 text-center text-sm text-gray-500 bg-gray-50 border-l border-gray-200 font-mono">{min}</td>
                                                    <td className="px-3 py-4 text-center text-sm text-gray-500 bg-gray-50 border-r border-gray-200 font-mono">{max}</td>
                                                    
                                                    <td className="px-3 py-4">
                                                        {isReadOnly ? <span className="text-sm truncate block">{row.instrument}</span> : 
                                                        <>
                                                            <select 
                                                                value={row.instrument} 
                                                                onChange={(e) => {
                                                                    if(e.target.value === 'CUSTOM_ENTRY') {
                                                                        const val = prompt("Saisir l'instrument :", "");
                                                                        if(val) handleTableChange(row.id, 'instrument', val);
                                                                    } else {
                                                                        handleTableChange(row.id, 'instrument', e.target.value);
                                                                    }
                                                                }} 
                                                                className="w-full text-sm border-gray-300 rounded-md p-1 bg-white focus:ring-yellow-500 focus:border-yellow-500"
                                                            >
                                                                <option value="" disabled>Choisir...</option>
                                                                {instrumentsEHG.map((inst, i) => <option key={i} value={inst}>{inst}</option>)}
                                                                <option value="CUSTOM_ENTRY" className="font-bold text-yellow-600">+ Autre...</option>
                                                                {!instrumentsEHG.includes(row.instrument) && row.instrument && <option value={row.instrument}>{row.instrument}</option>}
                                                            </select>
                                                        </>
                                                        }
                                                    </td>
                                                    
                                                    {isRunMode && (
                                                        <td className="px-3 py-4 bg-yellow-50/50">
                                                            <input 
                                                                type="text" 
                                                                placeholder="..." 
                                                                value={row.mesure}
                                                                onChange={(e) => handleTableChange(row.id, 'mesure', e.target.value)}
                                                                className="w-full border-b-2 border-gray-300 focus:border-yellow-500 focus:outline-none bg-transparent text-center font-bold"
                                                                style={{ color: theme.primary }}
                                                            />
                                                        </td>
                                                    )}
                                                    
                                                    {isRunMode && (
                                                        <td className="px-3 py-4 text-center">
                                                            <select 
                                                                value={row.status} 
                                                                onChange={(e) => handleTableChange(row.id, 'status', e.target.value)}
                                                                className={`w-full text-sm border-gray-300 rounded-md p-1 ${row.status === 'Conforme' ? 'bg-green-50 text-green-700 border-green-200' : row.status === 'Non-conforme' ? 'bg-red-50 text-red-700 border-red-200' : ''}`}
                                                            >
                                                                <option value="">-</option>
                                                                <option value="Conforme">Conforme</option>
                                                                <option value="Non-conforme">Non-conforme</option>
                                                            </select>
                                                        </td>
                                                    )}

                                                    {!isRunMode && (
                                                        <td className="px-3 py-4 text-right">
                                                            <button onClick={() => deleteRow(row.id)} className="text-red-400 hover:text-red-600"><Trash2 size={16} /></button>
                                                        </td>
                                                    )}
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                            {!isRunMode && (
                                <div className="bg-gray-50 px-6 py-4 border-t border-gray-200">
                                    <button onClick={addRow} className="flex items-center text-sm font-medium hover:opacity-80 transition-opacity" style={{ color: theme.primary }}>
                                        <Plus size={16} className="mr-2" /> Ajouter une cote
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                </main>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
