<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qualité Microsystèmes v4.2 - Gamme Technique</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- Babel pour JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- Icônes Lucide (SVG Components pour éviter les dépendances externes) ---
        const IconBase = ({ children, color = "currentColor", size = 24, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
                {children}
            </svg>
        );

        const Plus = (props) => <IconBase {...props}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></IconBase>;
        const Trash2 = (props) => <IconBase {...props}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></IconBase>;
        const ArrowLeft = (props) => <IconBase {...props}><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></IconBase>;
        const Save = (props) => <IconBase {...props}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></IconBase>;
        const Printer = (props) => <IconBase {...props}><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></IconBase>;
        const FileText = (props) => <IconBase {...props}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></IconBase>;
        const Edit3 = (props) => <IconBase {...props}><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></IconBase>;
        const Play = (props) => <IconBase {...props}><polygon points="5 3 19 12 5 21 5 3"></polygon></IconBase>;
        const Settings = (props) => <IconBase {...props}><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></IconBase>;
        const Search = (props) => <IconBase {...props}><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></IconBase>;
        const CheckCircle = (props) => <IconBase {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></IconBase>;
        const AlertTriangle = (props) => <IconBase {...props}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></IconBase>;
        const XCircle = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></IconBase>;

        // --- Définition des couleurs ---
        const theme = {
            primary: '#1a1a1a',
            accent: '#cfa346',
            accentText: '#856404',
            accentLight: '#f4e8cb',
            bg: '#f8f9fa',
            panel: '#ffffff',
            border: '#e0e0e0',
            text: '#2d3436',
            success: '#27ae60',
            warning: '#d35400',
            danger: '#c0392b',
        };

        // --- Données simulées ---
        const initialGammes = [
            { id: 101, ref: 'REF-2024-001', designation: 'Arbre de transmission', indice: 'A', date: '2024-02-14', status: 'Validée' },
            { id: 102, ref: 'REF-2024-002', designation: 'Boîtier Aluminium', indice: 'C', date: '2024-02-10', status: 'Brouillon' },
            { id: 103, ref: 'REF-2024-003', designation: 'Axe Pivot', indice: 'B', date: '2024-01-28', status: 'Obsolète' },
            { id: 104, ref: 'REF-2024-004', designation: 'Support Capteur', indice: 'A', date: '2024-03-01', status: 'Validée' },
        ];

        const App = () => {
            const [currentView, setCurrentView] = useState('home');
            const [editorMode, setEditorMode] = useState('create');
            const [selectedGammeId, setSelectedGammeId] = useState(null);

            const handleCreate = () => {
                setEditorMode('create');
                setSelectedGammeId(null);
                setCurrentView('editor');
            };

            const handleEdit = (id) => {
                setEditorMode('edit');
                setSelectedGammeId(id);
                setCurrentView('editor');
            };

            const handleRun = (id) => {
                setEditorMode('run');
                setSelectedGammeId(id);
                setCurrentView('editor');
            };

            const goHome = () => setCurrentView('home');

            return (
                <div className="min-h-screen font-sans" style={{ backgroundColor: theme.bg, color: theme.text }}>
                    {/* Navbar */}
                    <nav className="shadow-lg" style={{ backgroundColor: theme.primary, color: 'white' }}>
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex items-center justify-between h-16">
                                <div className="flex items-center gap-3 cursor-pointer" onClick={goHome}>
                                    <div className="p-1 rounded bg-white/10">
                                        <FileText className="h-6 w-6" style={{ color: theme.accent }} />
                                    </div>
                                    <span className="font-bold text-lg tracking-wide">Qualité Microsystèmes v4.2</span>
                                </div>
                                <div className="text-sm opacity-80">
                                    {currentView === 'home' ? 'Tableau de bord' : 
                                    editorMode === 'create' ? 'Nouvelle Gamme' : 
                                    editorMode === 'run' ? 'Mode Utilisation' : 'Mode Édition'}
                                </div>
                            </div>
                        </div>
                    </nav>

                    {currentView === 'home' ? (
                        <HomePage onCreate={handleCreate} onEdit={handleEdit} onRun={handleRun} gammes={initialGammes} />
                    ) : (
                        <EditorPage mode={editorMode} gammeId={selectedGammeId} onBack={goHome} />
                    )}
                </div>
            );
        };

        const HomePage = ({ onCreate, onEdit, onRun, gammes }) => {
            return (
                <main className="max-w-7xl mx-auto py-10 px-4 sm:px-6 lg:px-8">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-8 mb-12">
                        {/* Bouton Utiliser */}
                        <button 
                            onClick={() => document.getElementById('gamme-list').scrollIntoView({ behavior: 'smooth' })}
                            className="group relative overflow-hidden rounded-xl shadow-lg hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-1 text-left p-8"
                            style={{ backgroundColor: theme.panel, borderLeft: `6px solid ${theme.success}` }}
                        >
                            <div className="flex justify-between items-start mb-4">
                                <div className="p-3 rounded-full bg-green-100">
                                    <Play size={32} style={{ color: theme.success }} />
                                </div>
                                <div className="text-6xl font-black opacity-5 pointer-events-none absolute right-4 top-4">1</div>
                            </div>
                            <h3 className="text-2xl font-bold mb-2">Utiliser une gamme</h3>
                            <p className="text-gray-500">Lancer une session de contrôle qualité.</p>
                        </button>

                        {/* Bouton Créer */}
                        <button 
                            onClick={onCreate}
                            className="group relative overflow-hidden rounded-xl shadow-lg hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-1 text-left p-8"
                            style={{ backgroundColor: theme.panel, borderLeft: `6px solid ${theme.accent}` }}
                        >
                            <div className="flex justify-between items-start mb-4">
                                <div className="p-3 rounded-full" style={{ backgroundColor: theme.accentLight }}>
                                    <Plus size={32} style={{ color: theme.accentText }} />
                                </div>
                                <div className="text-6xl font-black opacity-5 pointer-events-none absolute right-4 top-4">2</div>
                            </div>
                            <h3 className="text-2xl font-bold mb-2">Créer une gamme</h3>
                            <p className="text-gray-500">Définir un nouveau protocole.</p>
                        </button>

                        {/* Bouton Éditer */}
                        <button 
                            onClick={() => document.getElementById('gamme-list').scrollIntoView({ behavior: 'smooth' })}
                            className="group relative overflow-hidden rounded-xl shadow-lg hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-1 text-left p-8"
                            style={{ backgroundColor: theme.panel, borderLeft: `6px solid ${theme.primary}` }}
                        >
                            <div className="flex justify-between items-start mb-4">
                                <div className="p-3 rounded-full bg-gray-200">
                                    <Edit3 size={32} style={{ color: theme.primary }} />
                                </div>
                                <div className="text-6xl font-black opacity-5 pointer-events-none absolute right-4 top-4">3</div>
                            </div>
                            <h3 className="text-2xl font-bold mb-2">Éditer une gamme</h3>
                            <p className="text-gray-500">Modifier les spécifications existantes.</p>
                        </button>
                    </div>

                    {/* Liste */}
                    <div id="gamme-list" className="bg-white shadow-xl rounded-2xl overflow-hidden border border-gray-100">
                        <div className="p-6 border-b border-gray-100 flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div className="flex items-center gap-3">
                                <Settings className="text-gray-400" />
                                <h2 className="text-xl font-bold text-gray-800">Base de données des Gammes</h2>
                            </div>
                            <div className="relative">
                                <input 
                                    type="text" 
                                    placeholder="Rechercher une référence..." 
                                    className="pl-10 pr-4 py-2 rounded-full border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-yellow-500 w-full md:w-64"
                                />
                                <Search className="absolute left-3 top-2.5 h-4 w-4 text-gray-400" />
                            </div>
                        </div>

                        <div className="overflow-x-auto">
                            <table className="min-w-full divide-y divide-gray-100">
                                <thead className="bg-gray-50">
                                    <tr>
                                        <th className="px-6 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Référence</th>
                                        <th className="px-6 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Désignation</th>
                                        <th className="px-6 py-4 text-center text-xs font-semibold text-gray-500 uppercase tracking-wider">Indice</th>
                                        <th className="px-6 py-4 text-center text-xs font-semibold text-gray-500 uppercase tracking-wider">Date</th>
                                        <th className="px-6 py-4 text-center text-xs font-semibold text-gray-500 uppercase tracking-wider">Statut</th>
                                        <th className="px-6 py-4 text-right text-xs font-semibold text-gray-500 uppercase tracking-wider">Actions</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-100">
                                    {gammes.map((gamme) => (
                                        <tr key={gamme.id} className="hover:bg-yellow-50/30 transition-colors group">
                                            <td className="px-6 py-4 whitespace-nowrap font-medium" style={{ color: theme.primary }}>{gamme.ref}</td>
                                            <td className="px-6 py-4 whitespace-nowrap text-gray-600">{gamme.designation}</td>
                                            <td className="px-6 py-4 whitespace-nowrap text-center">
                                                <span className="px-2 py-1 rounded bg-gray-100 text-xs font-bold text-gray-600">{gamme.indice}</span>
                                            </td>
                                            <td className="px-6 py-4 whitespace-nowrap text-center text-sm text-gray-500">{gamme.date}</td>
                                            <td className="px-6 py-4 whitespace-nowrap text-center">
                                                <StatusBadge status={gamme.status} />
                                            </td>
                                            <td className="px-6 py-4 whitespace-nowrap text-right text-sm font-medium flex justify-end gap-2">
                                                <button onClick={() => onRun(gamme.id)} className="flex items-center gap-1 px-3 py-1.5 rounded-md text-white shadow-sm hover:opacity-90 transition-all active:scale-95" style={{ backgroundColor: theme.success }}>
                                                    <Play size={14} /> Utiliser
                                                </button>
                                                <button onClick={() => onEdit(gamme.id)} className="flex items-center gap-1 px-3 py-1.5 rounded-md border shadow-sm hover:bg-gray-50 transition-colors" style={{ borderColor: theme.border, color: theme.text }}>
                                                    <Edit3 size={14} /> Éditer
                                                </button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </main>
            );
        };

        const StatusBadge = ({ status }) => {
            let bg = '#e0e0e0';
            let color = '#555';
            let Icon = null;

            if (status === 'Validée') { bg = '#dcfce7'; color = '#166534'; Icon = CheckCircle; }
            else if (status === 'Brouillon') { bg = '#fef9c3'; color = '#854d0e'; Icon = Edit3; }
            else if (status === 'Obsolète') { bg = '#fee2e2'; color = '#991b1b'; Icon = AlertTriangle; }

            return (
                <span className="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-medium" style={{ backgroundColor: bg, color: color }}>
                    {Icon && <Icon size={12} />}
                    {status}
                </span>
            );
        };

        const EditorPage = ({ mode, gammeId, onBack }) => {
            const isRunMode = mode === 'run';
            const isReadOnly = isRunMode;

            const [headerInfo, setHeaderInfo] = useState({
                designation: gammeId ? 'Arbre de transmission' : '',
                reference: gammeId ? 'REF-2024-001' : '',
                indice: gammeId ? 'A' : ''
            });

            const [measurements, setMeasurements] = useState([
                { id: 1, sequence: '10', designation: 'Diamètre extérieur', target: '25.00', tolerance: '0.05', instrument: "Micromètre d'extérieur", mesure: '' },
                { id: 2, sequence: '20', designation: 'Longueur totale', target: '100.00', tolerance: '0.10', instrument: "Pied à coulisse digital", mesure: '' }
            ]);

            const instrumentsEHG = [
                "Pied à coulisse digital", "Micromètre d'extérieur", "Comparateur", 
                "Colonne de mesure", "Projecteur de profil", "Tampon Go/NoGo"
            ];

            const handleTableChange = (id, field, value) => {
                setMeasurements(prev => prev.map(row => row.id === id ? { ...row, [field]: value } : row));
            };

            const addRow = () => {
                const newId = measurements.length > 0 ? Math.max(...measurements.map(m => m.id)) + 1 : 1;
                const lastSequence = measurements.length > 0 ? parseInt(measurements[measurements.length - 1].sequence) || 0 : 0;
                setMeasurements([...measurements, { 
                    id: newId, sequence: (lastSequence + 10).toString(), 
                    designation: '', target: '', tolerance: '', instrument: instrumentsEHG[0], mesure: '' 
                }]);
            };

            const deleteRow = (id) => {
                setMeasurements(prev => prev.filter(row => row.id !== id));
            };

            const calculateLimits = (target, tolerance) => {
                const t = parseFloat(target);
                const tol = parseFloat(tolerance);
                if (isNaN(t) || isNaN(tol)) return { min: '-', max: '-' };
                const min = (t - tol).toFixed(2);
                const max = (t + tol).toFixed(2);
                return { min, max };
            };

            const checkConformity = (val, min, max) => {
                if (val === '' || val === undefined) return 'PENDING';
                const v = parseFloat(val);
                const m = parseFloat(min);
                const M = parseFloat(max);
                if (isNaN(v) || isNaN(m) || isNaN(M)) return 'PENDING';
                if (v >= m && v <= M) return 'OK';
                return 'NOK';
            };

            return (
                <main className="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
                    <div className="flex justify-between items-center mb-6">
                        <div className="flex items-center gap-4">
                            <button onClick={onBack} className="p-2 rounded-full hover:bg-gray-200 transition-colors">
                                <ArrowLeft size={20} />
                            </button>
                            <h1 className="text-2xl font-bold" style={{ color: theme.primary }}>
                                {mode === 'create' ? 'Création de Gamme' : mode === 'run' ? 'Saisie des Mesures' : 'Édition de Gamme'}
                            </h1>
                        </div>
                        <div className="flex gap-2">
                            <button className="flex items-center gap-2 px-4 py-2 bg-white border rounded-md shadow-sm text-gray-700 hover:bg-gray-50">
                                <Printer size={16} /> Imprimer
                            </button>
                            {!isRunMode && (
                                <button className="flex items-center gap-2 px-4 py-2 text-white rounded-md shadow-sm transition-colors" style={{ backgroundColor: theme.success }}>
                                    <Save size={16} /> Enregistrer
                                </button>
                            )}
                            {isRunMode && (
                                <button className="flex items-center gap-2 px-4 py-2 text-white rounded-md shadow-sm transition-colors" style={{ backgroundColor: theme.primary }}>
                                    <CheckCircle size={16} /> Valider le contrôle
                                </button>
                            )}
                        </div>
                    </div>

                    <div className="bg-white shadow rounded-lg p-6 mb-8 border-l-4" style={{ borderColor: theme.accent }}>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            {['designation', 'reference', 'indice'].map((field) => (
                                <div key={field}>
                                    <label className="block text-sm font-medium text-gray-700 mb-1 capitalize">{field}</label>
                                    <input
                                        type="text"
                                        value={headerInfo[field]}
                                        disabled={isReadOnly}
                                        onChange={(e) => setHeaderInfo({ ...headerInfo, [field]: e.target.value })}
                                        className={`w-full rounded-md border border-gray-300 shadow-sm sm:text-sm p-2 ${isReadOnly ? 'bg-gray-100 text-gray-500' : ''}`}
                                    />
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="bg-white shadow rounded-lg overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="min-w-full divide-y divide-gray-200">
                                <thead className="bg-gray-50">
                                    <tr>
                                        <th className="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-16">Seq</th>
                                        <th className="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Désignation</th>
                                        <th className="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-20">Cible</th>
                                        <th className="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-20">Tol (+/-)</th>
                                        <th className="px-3 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider w-20 bg-gray-100 border-l border-gray-200">Lim Inf</th>
                                        <th className="px-3 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider w-20 bg-gray-100 border-r border-gray-200">Lim Sup</th>
                                        <th className="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-40">Instrument</th>
                                        {isRunMode && <th className="px-3 py-3 text-center text-xs font-bold uppercase tracking-wider w-32" style={{ color: theme.accentText, backgroundColor: theme.accentLight }}>Mesure</th>}
                                        {isRunMode && <th className="px-3 py-3 text-center text-xs font-bold uppercase tracking-wider w-24">Conformité</th>}
                                        {!isRunMode && <th className="px-3 py-3 w-16"></th>}
                                    </tr>
                                </thead>
                                <tbody className="bg-white divide-y divide-gray-200">
                                    {measurements.map((row) => {
                                        const { min, max } = calculateLimits(row.target, row.tolerance);
                                        const conformity = isRunMode ? checkConformity(row.mesure, min, max) : null;
                                        
                                        return (
                                            <tr key={row.id}>
                                                <td className="px-3 py-4"><input value={row.sequence} disabled={isReadOnly} onChange={(e) => handleTableChange(row.id, 'sequence', e.target.value)} className="w-full text-center font-mono text-sm border-none bg-transparent" /></td>
                                                <td className="px-3 py-4"><input value={row.designation} disabled={isReadOnly} onChange={(e) => handleTableChange(row.id, 'designation', e.target.value)} className="w-full text-sm border-none bg-transparent" /></td>
                                                <td className="px-3 py-4"><input value={row.target} disabled={isReadOnly} onChange={(e) => handleTableChange(row.id, 'target', e.target.value)} className="w-full text-right text-sm border-none bg-transparent" /></td>
                                                <td className="px-3 py-4"><input value={row.tolerance} disabled={isReadOnly} onChange={(e) => handleTableChange(row.id, 'tolerance', e.target.value)} className="w-full text-right text-sm border-none bg-transparent" /></td>
                                                
                                                <td className="px-3 py-4 text-center text-sm text-gray-500 bg-gray-50 border-l border-gray-200 font-mono">{min}</td>
                                                <td className="px-3 py-4 text-center text-sm text-gray-500 bg-gray-50 border-r border-gray-200 font-mono">{max}</td>
                                                
                                                <td className="px-3 py-4">
                                                    {isReadOnly ? <span className="text-sm truncate block">{row.instrument}</span> : 
                                                    <select value={row.instrument} onChange={(e) => handleTableChange(row.id, 'instrument', e.target.value)} className="w-full text-sm border-gray-300 rounded-md">
                                                        {instrumentsEHG.map((inst, i) => <option key={i} value={inst}>{inst}</option>)}
                                                    </select>}
                                                </td>
                                                
                                                {isRunMode && (
                                                    <td className="px-3 py-4 bg-yellow-50/50">
                                                        <input 
                                                            type="text" 
                                                            placeholder="..." 
                                                            value={row.mesure}
                                                            onChange={(e) => handleTableChange(row.id, 'mesure', e.target.value)}
                                                            className="w-full border-b-2 border-gray-300 focus:border-yellow-500 focus:outline-none bg-transparent text-center font-bold"
                                                            style={{ color: theme.primary }}
                                                        />
                                                    </td>
                                                )}
                                                
                                                {isRunMode && (
                                                    <td className="px-3 py-4 text-center">
                                                        {conformity === 'OK' && (
                                                            <div className="inline-flex items-center gap-1 px-2 py-1 rounded-full bg-green-100 text-green-700 text-xs font-bold">
                                                                <CheckCircle size={14} /> OK
                                                            </div>
                                                        )}
                                                        {conformity === 'NOK' && (
                                                            <div className="inline-flex items-center gap-1 px-2 py-1 rounded-full bg-red-100 text-red-700 text-xs font-bold animate-pulse">
                                                                <XCircle size={14} /> NOK
                                                            </div>
                                                        )}
                                                        {conformity === 'PENDING' && <span className="text-gray-300">-</span>}
                                                    </td>
                                                )}

                                                {!isRunMode && (
                                                    <td className="px-3 py-4 text-right">
                                                        <button onClick={() => deleteRow(row.id)} className="text-red-400 hover:text-red-600"><Trash2 size={16} /></button>
                                                    </td>
                                                )}
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                        {!isRunMode && (
                            <div className="bg-gray-50 px-6 py-4 border-t border-gray-200">
                                <button onClick={addRow} className="flex items-center text-sm font-medium hover:opacity-80 transition-opacity" style={{ color: theme.primary }}>
                                    <Plus size={16} className="mr-2" /> Ajouter une cote
                                </button>
                            </div>
                        )}
                    </div>
                </main>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
