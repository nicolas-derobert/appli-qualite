<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enquête au Fournil Léman</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Application d'enquête qualité : 12 étapes et 12 outils du chapitre 9 (MT_322) appliqués aux baguettes trop légères.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
/* Carnet d'enquête : rail des 12 étapes groupées par phase PDCA en haut ; dossier (scène, données) à gauche ; mission (une tâche à la fois) à droite. */
:root {
  --bg: #FFFFFF; --surface: #F4F6F9; --surface-2: #E8ECF2; --ink: #1B2A4A; --text: #1F2533; --muted: #5C677A; --line: #D5DBE4;
  --navy: #1B2A4A; --on-navy: #FFFFFF; --navy-soft: #E6EBF3; --gold: #B8892E; --gold-ink: #7A5A12; --gold-soft: #F6EFDD; --gold-line: #E3CF9E;
  --ok: #2E7D4F; --ok-soft: #E5F2EA; --ko: #B03A2E; --ko-soft: #F8E6E3; --matin: #8C95A6; --apm: #C29A3A; --focus: #2F6FD1; --shadow: 0 1px 2px rgba(27, 42, 74, .08);
  --display: "Source Serif 4", Cambria, Georgia, serif; --body: "Source Sans 3", "Segoe UI", Arial, sans-serif; --mono: "Source Sans 3", "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #13161C; --surface: #1B2029; --surface-2: #242B37; --ink: #E4E9F2; --text: #D9DFE9; --muted: #9AA5B6; --line: #323A48;
  --navy: #A9BCE0; --on-navy: #13161C; --navy-soft: #22304A; --gold: #D6AE55; --gold-ink: #E7C97F; --gold-soft: #2C2616; --gold-line: #5A4A22;
  --ok: #6CC28F; --ok-soft: #16281E; --ko: #F08B7F; --ko-soft: #34191A; --matin: #9AA4B6; --apm: #D6AE55; --focus: #7FB0FF; --shadow: none; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #13161C; --surface: #1B2029; --surface-2: #242B37; --ink: #E4E9F2; --text: #D9DFE9; --muted: #9AA5B6; --line: #323A48;
  --navy: #A9BCE0; --on-navy: #13161C; --navy-soft: #22304A; --gold: #D6AE55; --gold-ink: #E7C97F; --gold-soft: #2C2616; --gold-line: #5A4A22;
  --ok: #6CC28F; --ok-soft: #16281E; --ko: #F08B7F; --ko-soft: #34191A; --matin: #9AA4B6; --apm: #D6AE55; --focus: #7FB0FF; --shadow: none; color-scheme: dark }

html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); font-size: 15.5px; line-height: 1.45; font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); color: var(--ink); margin: 0; text-wrap: balance; }

.app { height: 100%; display: flex; flex-direction: column; gap: 8px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { display: flex; align-items: center; gap: 8px 18px; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand small { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold-ink); font-weight: 700; }
.brand h1 { font-size: 19px; line-height: 1.15; }
.rail { display: flex; gap: 10px; align-items: flex-end; flex: 1; min-width: 0; overflow-x: auto; padding-block: 2px; }
.phase { display: flex; flex-direction: column; gap: 3px; }
.phase > span { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding-left: 2px; white-space: nowrap; }
.phase > div { display: flex; gap: 4px; }
.pill { width: 29px; height: 29px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--bg); font-weight: 700; font-size: 13px; color: var(--muted); display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.pill.done { background: var(--navy); border-color: var(--navy); color: var(--on-navy); }
.pill.cur { border-color: var(--gold); border-width: 2.5px; color: var(--ink); }
.pill.done.cur { box-shadow: 0 0 0 3px var(--gold); color: var(--on-navy); }
.pill.bilan { width: auto; border-radius: 15px; padding: 0 12px; }
.btn { border: 1.5px solid var(--line); background: var(--bg); border-radius: 9px; padding: 7px 14px; font-weight: 700; color: var(--ink); }
.btn:hover { border-color: var(--navy); }
.btn.primary { background: var(--navy); border-color: var(--navy); color: var(--on-navy); }
.btn.gold { background: var(--gold-soft); border-color: var(--gold-line); color: var(--gold-ink); }
.btn:disabled { opacity: .45; cursor: default; }

.stage { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.3fr); gap: 14px; }
.panel { min-height: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); box-shadow: var(--shadow); }
.panel-head { display: flex; align-items: center; gap: 8px 10px; padding: 10px 16px 0; flex-wrap: wrap; }
.tabs { display: flex; gap: 4px; background: var(--surface); border-radius: 10px; padding: 3px; }
.tab { border: 0; background: transparent; border-radius: 8px; padding: 4px 11px; font-weight: 700; font-size: 14.5px; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--bg); color: var(--ink); box-shadow: var(--shadow); }
.tab:disabled { opacity: .4; cursor: default; }
#tab-ex:not(:disabled) { color: var(--gold-ink); }
#tab-ex[aria-selected="true"] { color: var(--gold-ink); box-shadow: inset 0 0 0 1.5px var(--gold-line); }
.exbox { border: 1.5px solid var(--gold-line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 9px; background: var(--bg); }
.exhead { margin: 0; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--gold-ink); }
.exq { margin: 0; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.exq2 { margin: 0 0 3px; color: var(--muted); font-size: 14px; }
.exrow { display: grid; grid-template-columns: 118px minmax(0, 1fr); gap: 4px 12px; align-items: start; }
.exrow > span { font-weight: 700; color: var(--ink); font-size: 13.5px; padding-top: 1px; }
.exrow p { margin: 0; } .exrow ul { margin: 0; padding-left: 18px; } .exrow li + li { margin-top: 2px; }
.exfig { display: grid; gap: 4px; } .exfig .label { margin: 4px 0 0; } .exfig .ch { max-height: min(240px, 34vh); }
.panel-body { flex: 1; min-height: 0; overflow: auto; padding: 10px 16px 14px; }
.when { color: var(--muted); font-style: italic; margin: 0 0 10px; display: flex; gap: 8px; align-items: center; }
.when svg { flex: none; }
.scene-img { background: var(--surface); border-radius: 12px; display: grid; place-items: center; padding: 8px; margin-bottom: 10px; }
.scene-img img { max-height: min(150px, 19vh); width: auto; }
.lines { display: flex; flex-direction: column; gap: 8px; }
.line { display: grid; grid-template-columns: 50px minmax(0, 1fr); gap: 10px; align-items: start; }
.who { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11.5px; font-weight: 700; color: var(--ink); }
.who img { width: 44px; height: 44px; }
.bubble { background: var(--surface); border-radius: 12px; padding: 8px 12px; position: relative; }
.bubble p { margin: 0; }
.bubble p + p { margin-top: 5px; }
.bubble::before { content: ""; position: absolute; left: -7px; top: 16px; border: 7px solid transparent; border-left: 0; border-right-color: var(--surface); }
.line.vous .bubble { background: var(--gold-soft); }
.line.vous .bubble::before { border-right-color: var(--gold-soft); }

.label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 10px 0 5px; }
.label:first-child { margin-top: 0; }
table.t { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 13px; }
.t th, .t td { border: 1px solid var(--line); padding: 3px 5px; text-align: center; }
.t th { background: var(--navy-soft); color: var(--ink); font-weight: 700; }
.t td.l, .t th.l { text-align: left; }
.t.tight td, .t.tight th { padding: 1px 6px; }
.t .apm { background: var(--gold-soft); }
.tw { overflow-x: auto; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.note { background: var(--navy-soft); border-radius: 10px; padding: 8px 12px; margin-top: 8px; font-size: 14px; }
.note.gold { background: var(--gold-soft); }
.chips-legend { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.chips-legend div { background: var(--surface); border-radius: 8px; padding: 6px 4px; text-align: center; font-size: 12.5px; }
.chips-legend img { height: 18px; width: auto; display: block; margin: 0 auto 3px; }
.ideas { margin: 0; padding-left: 22px; columns: 2; column-gap: 22px; font-size: 13.5px; }
.ideas li { break-inside: avoid; margin-bottom: 4px; }
.temps { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.temps div { background: var(--surface); border-radius: 10px; padding: 8px 12px; }
.temps b { color: var(--ink); }

.mtop { display: flex; align-items: center; justify-content: space-between; gap: 6px 14px; flex-wrap: wrap; padding: 10px 16px 0; }
.mission-head h2 { font-size: 19px; }
.oqs { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.oq { position: relative; display: inline-flex; flex-direction: column; align-items: flex-start; padding: 3px 10px 4px; border: 1.5px solid var(--gold); background: var(--gold-soft); border-radius: 10px; color: var(--ink); line-height: 1.15; font-family: var(--body); text-align: left; margin-bottom: 5px; }
.oq::after { content: ""; position: absolute; left: 12px; bottom: -5.5px; width: 8px; height: 8px; background: var(--gold-soft); border-right: 1.5px solid var(--gold); border-bottom: 1.5px solid var(--gold); transform: rotate(45deg); }
button.oq { cursor: pointer; } button.oq:hover, button.oq:hover::after { background: var(--bg); }
button.oq[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--gold-line); }
.oq small { font-size: 9px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--gold-ink); }
.oq b { font-size: 13px; white-space: nowrap; color: var(--ink); }
.oq.mini { padding: 1px 8px 2px; border-radius: 8px; margin-bottom: 4px; } .oq.mini b { font-size: 12px; } .oq.mini::after { width: 6px; height: 6px; bottom: -4.5px; left: 10px; }
.rap { gap: 6px; font-size: 14.5px; line-height: 1.38; } .rap .exrow ul li + li, .rap .exrow ol li + li { margin-top: 1px; }
.rapseg { margin-bottom: 10px; } .rapseg button { font-size: 14px; }
.raphead { display: flex; align-items: center; gap: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.raphead h3 { font-size: 18px; } .raphead .exhead { margin-bottom: 2px; }
.rap + .rap { margin-top: 12px; } .exrow ol { margin: 0; padding-left: 20px; } .exrow ol li + li { margin-top: 2px; }
.raplink { margin: 2px 0 0; font-size: 13px; color: var(--muted); padding-top: 6px; border-top: 1px solid var(--line); } .raplink b { color: var(--ink); margin-right: 4px; }
.exheadrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; } .exheadrow .exhead { flex: 1; } .exheadrow .oqs { margin-left: auto; }
.steps { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
.tdot { min-width: 30px; height: 26px; border-radius: 13px; border: 1.5px solid var(--line); background: var(--bg); font-size: 12px; font-weight: 700; color: var(--muted); padding: 0 8px; }
.tdot.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.tdot.rev { background: var(--surface-2); border-color: var(--muted); color: var(--muted); }
.tdot.cur { border-color: var(--gold); border-width: 2.5px; color: var(--ink); }
.task { flex: 1; min-height: 0; overflow: auto; padding: 10px 16px; display: flex; flex-direction: column; gap: 8px; }
.consigne { font-size: 16.5px; margin: 0; color: var(--text); }
.consigne b { color: var(--ink); }
.aide { margin: -4px 0 0; color: var(--muted); font-size: 13.5px; }
.bar { display: flex; align-items: center; gap: 10px; padding: 8px 16px 10px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.fb { flex: 1; min-width: 180px; font-size: 14.5px; }
.fb b { margin-right: 4px; }
.fb.ok { color: var(--ok); } .fb.ko { color: var(--ko); } .fb.rev { color: var(--muted); }
.fb span { color: var(--text); }

input.num { width: 64px; padding: 5px 6px; border: 1.5px solid var(--line); border-radius: 7px; background: var(--bg); text-align: center; font-family: var(--mono); font-size: 14px; }
input.num.wide { width: 86px; }
input.num.is-ok { border-color: var(--ok); background: var(--ok-soft); }
input.num.is-ko { border-color: var(--ko); background: var(--ko-soft); }
.field { display: flex; align-items: center; gap: 8px; }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px 18px; }
.unit { color: var(--muted); font-size: 13px; }
.opts { display: grid; gap: 6px; }
.opt { text-align: left; border: 1.5px solid var(--line); background: var(--bg); border-radius: 10px; padding: 7px 12px 7px 40px; position: relative; line-height: 1.35; }
.opt::before { content: ""; position: absolute; left: 13px; top: 50%; width: 16px; height: 16px; margin-top: -8px; border: 2px solid var(--muted); border-radius: 50%; }
.opt.multi::before { border-radius: 4px; }
.opt[aria-checked="true"] { border-color: var(--navy); background: var(--navy-soft); }
.opt[aria-checked="true"]::before { border-color: var(--navy); background: var(--navy); box-shadow: inset 0 0 0 3px var(--bg); }
.opt.is-ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.is-ko { border-color: var(--ko); background: var(--ko-soft); }
.rows { display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 10px; align-items: center; }
.row label, .row .rl { font-weight: 700; color: var(--ink); }
.row select { width: 100%; padding: 6px 8px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--bg); }
.row select.is-ok { border-color: var(--ok); background: var(--ok-soft); } .row select.is-ko { border-color: var(--ko); background: var(--ko-soft); }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { border: 0; background: var(--bg); padding: 6px 14px; font-weight: 700; color: var(--muted); }
.seg button + button { border-left: 1.5px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--navy); color: var(--on-navy); }
.seg.is-ok { border-color: var(--ok); } .seg.is-ko { border-color: var(--ko); }
.order { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.order li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 8px; align-items: center; background: var(--surface); border: 1.5px solid transparent; border-radius: 9px; padding: 6px 8px; }
.order li .rk { font-weight: 700; color: var(--gold-ink); text-align: center; font-variant-numeric: tabular-nums; }
.order li.is-ok { border-color: var(--ok); } .order li.is-ko { border-color: var(--ko); }
.mv { display: flex; gap: 4px; }
.mv button { width: 30px; height: 28px; border-radius: 7px; border: 1.5px solid var(--line); background: var(--bg); font-weight: 700; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.split.auto { grid-template-columns: auto minmax(0, 1fr); align-items: center; }
.figc .ch { max-height: min(230px, 33vh); }
.t .nw { white-space: nowrap; }
.order.compact { gap: 4px; } .order.compact li { padding: 2px 8px; } .order.compact .mv button { height: 24px; }
.ch.radar text { font-size: 13px; }
.symlist { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 0; padding: 0; list-style: none; }
.symlist li { display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 9px; padding: 6px 10px; }
.symlist svg { flex: none; } .symlist svg * { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.ch { width: 100%; height: auto; display: block; max-height: min(300px, 44vh); }
.ch text { fill: var(--muted); font-family: var(--body); font-size: 12px; }
.ch .ink { fill: var(--ink); } .ch .b { font-weight: 700; }
.ch .grid { stroke: var(--line); stroke-width: 1; }
.ch .axis { stroke: var(--muted); stroke-width: 1; }
.ch .l-apm { stroke: var(--apm); stroke-width: 2.5; fill: none; }
.ch .l-navy { stroke: var(--navy); stroke-width: 2; fill: none; }
.ch .f-apm { fill: var(--apm); } .ch .f-matin { fill: var(--matin); } .ch .f-navy { fill: var(--navy); } .ch .f-ko { fill: var(--ko); } .ch .f-bg { fill: var(--bg); }
.ch .ref { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }
.ch .ref-ko { stroke: var(--ko); stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }
.ch .tol { stroke: var(--ko); stroke-width: 1.5; }
.ch .band { fill: var(--navy-soft); }
.ch .hit { cursor: pointer; }
.ch .hit:hover { stroke: var(--gold); stroke-width: 3; }
.ch .picked { stroke: var(--ink); stroke-width: 3; }
.ch .handle { fill: var(--bg); stroke: var(--navy); stroke-width: 2.5; cursor: grab; }
.ch .ring { fill: none; stroke: var(--line); }
.ch .poly-a { fill: var(--matin); fill-opacity: .25; stroke: var(--matin); stroke-width: 2.5; }
.ch .poly-b { fill: var(--apm); fill-opacity: .2; stroke: var(--apm); stroke-width: 3; }
.ch .tgt { fill: transparent; stroke: transparent; cursor: pointer; }
.ch .tgt:hover { fill: var(--gold-soft); stroke: var(--gold); }
.drag { touch-action: none; }

.tally { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.days { display: grid; gap: 6px; }
.day { display: grid; grid-template-columns: 70px repeat(6, minmax(0, 1fr)); gap: 4px; align-items: center; font-size: 13px; }
.code { border: 1.5px solid var(--line); background: var(--bg); border-radius: 7px; padding: 4px 0; font-family: var(--mono); font-weight: 600; font-size: 13px; }
.code.A { color: var(--gold-ink); }
.code.used { text-decoration: line-through; opacity: .45; }
.marks { vertical-align: middle; }
.marks line { stroke: var(--ink); stroke-width: 1.8; stroke-linecap: round; }
.pool { display: flex; flex-wrap: wrap; gap: 6px; min-height: 34px; }
.chip { border: 1.5px solid var(--line); background: var(--bg); border-radius: 18px; padding: 4px 11px; font-size: 13px; }
.chip b { color: var(--gold-ink); margin-right: 4px; }
.chip.sel { border-color: var(--gold); background: var(--gold-soft); box-shadow: 0 0 0 2px var(--gold-line); }
.chip.is-ok { border-color: var(--ok); } .chip.is-ko { border-color: var(--ko); background: var(--ko-soft); }
.bins { display: grid; gap: 8px; }
.fish { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) 120px; grid-template-rows: auto 26px auto; gap: 6px 8px; }
.binbox { border: 1.5px dashed var(--line); border-radius: 10px; padding: 6px; min-height: 76px; background: var(--surface); text-align: left; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.binbox:hover { border-color: var(--gold); }
.binbox > span { font-weight: 700; color: var(--ink); font-size: 13px; }
.spine { grid-column: 1 / 4; align-self: center; height: 3px; background: var(--navy); position: relative; }
.spine::after { content: ""; position: absolute; right: -2px; top: -6px; border: 7.5px solid transparent; border-right: 0; border-left-color: var(--navy); }
.effect { grid-column: 4; grid-row: 1 / 4; align-self: center; background: var(--navy); color: var(--on-navy); border-radius: 10px; padding: 10px; font-weight: 700; font-size: 13px; text-align: center; }
.sym { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.exit { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--surface); border-radius: 10px; padding: 8px 12px; }
.exit p { margin: 0; }
.radar-wrap { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 12px; align-items: center; }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.sw.a { background: var(--matin); } .sw.b { background: var(--apm); }
.cle { background: var(--gold-soft); border: 1px solid var(--gold-line); border-radius: 12px; padding: 14px 16px; }
.cle h3 { font-size: 17px; color: var(--gold-ink); margin-bottom: 4px; }
.cle p { margin: 0; font-size: 16px; }

 { n: 8, title: 'Prouver le lien température-poids', tool: 'Diagramme de corrélation', ref: 'cours 9.8',
   scene: { when: 'Mardi 20 octobre · 14 h · Pétrin', img: 'petrin', alt: 'Sonde dans la pâte : 28,4 °C', lines: [['vous', "La pâte de l'après-midi est-elle vraiment plus chaude ? Cette chaleur allège-t-elle la baguette ?"], ['nadia', 'Je mesure la pâte de chaque pétrin, en fin de pétrissage.'], ['nadia', 'Ensuite, je pèse 5 baguettes de ce pétrin et je calcule leur poids moyen.'], ['yanis', '28,4 °C sur ce pétrin. La cible est 24 °C.']] },
   data: () => { const rows = [['Matin : °C', 'Matin : g', 'Après-midi : °C', 'Après-midi : g']]; for (let i = 0; i < 10; i++) rows.push([{ t: fmt(ES[i].T), c: 'mono' }, { t: fmt(ES[i].W), c: 'mono' }, { t: fmt(ES[10 + i].T), c: 'mono apm' }, { t: fmt(ES[10 + i].W), c: 'mono apm' }]);
     return `<p class="label">20 pétrins · température de la pâte et poids moyen de 5 baguettes</p>${tTable(rows)}<div class="note">Pour garder les baguettes au-dessus de 240 g, le poids moyen d'un pétrin doit rester ≥ 247 g.</div>`; },
   tasks: [
    { id: '8a', q: 'Décrivez la relation entre la température et le poids : sens, forme et force.', kind: 'choice', fig: () => svgScatter(), options: ['Négative, linéaire et très forte.', 'Positive, linéaire et forte.', 'Négative et faible.', 'Les deux grandeurs varient au hasard.'], correct: 0,
      ok: 'Quand la température monte, le poids baisse, sur une droite.', ko: 'Regardez le sens de la pente et la dispersion autour d\'une droite.' },
    { id: '8b', q: 'Calculez le coefficient de corrélation r sur les 20 pétrins, arrondi à 0,01.', kind: 'num', ui: () => `<div class="fields">${field('r', 'r', reg.r.toFixed(2), '', { dec: 2, min: -0.995, max: -0.985 })}</div><p class="aide">Calculatrice : régression linéaire. Excel : COEFFICIENT.CORRELATION.</p>`,
      ok: 'r = −0,99 : relation négative très forte.', ko: 'r est négatif ici, et proche de −1.' },
    { id: '8c', q: 'Tracez à la main la droite qui passe au plus près des points.', help: 'Déplacez les deux poignées de la droite.', kind: 'line',
      ok: 'Votre droite suit le nuage de points.', ko: 'Placez la droite au milieu des points, des pâtes froides aux pâtes chaudes.' },
    { id: '8d', q: 'Relevez sur votre droite la température qui donne un poids moyen de 247 g, en °C, arrondie à 0,1.', kind: 'num',
      ui: v => { const L = lineOf(v), t = L && Math.abs(L[1].t - L[0].t) >= 1 ? (() => { const b = (L[1].w - L[0].w) / (L[1].t - L[0].t); return b < 0 ? L[0].t + (247 - L[0].w) / b : NaN; })() : NaN, te = Number.isFinite(t) && t > 22 && t < 30 ? t : (247 - reg.a) / reg.b;
        return `<div class="fields">${field('t247', 'Température', te.toFixed(1), '°C', { min: +(te - 0.3).toFixed(2), max: +(te + 0.3).toFixed(2) })}</div><div>${svgScatter({ line: L })}</div>`; },

    { id: '8e', q: 'Comparez cette température à la température de pâte visée : 24 ± 1 °C.', kind: 'choice', options: ['25,5 °C dépasse la plage visée : une pâte à 23–25 °C garde un poids moyen ≥ 247 g.', '25,5 °C se trouve dans la plage visée.', 'La plage visée fait perdre du poids.'], correct: 0,
      ok: 'La cible 24 ± 1 °C reste sous 25,5 °C : elle protège le poids.', ko: 'La plage visée va de 23 à 25 °C.' },
    { id: '8f', q: 'Indiquez si la cause A est vérifiée.', kind: 'choice', options: ["Oui : les pâtes de l'après-midi (27,2 à 29,5 °C) donnent toutes un poids moyen sous 247 g.", 'Non : le poids dépend seulement de la diviseuse.', 'Impossible à dire avec 20 pétrins.'], correct: 0,
      ok: 'La cause A est vérifiée par les données.', ko: "Regardez la position de tous les pétrins de l'après-midi." },
   ], cle: 'La cause A est vérifiée. Les deux nuages séparés montrent aussi la stratification.' },

 { n: 9, title: 'Remonter à la cause racine', tool: '5 pourquoi', ref: 'cours 9.12',

      ok: "L'après-midi, l'eau du robinet donne une pâte trop chaude : il manque la glace.", ko: 'Comparez 19 °C et 8 °C à 18 °C.' },
    { id: '9c', q: 'Classez les 5 réponses dans l\'ordre des « Pourquoi ? ».', help: "Partez de l'effet : les baguettes trop légères.", kind: 'order', seed: 9,

function svgRChart() {
  const x0 = 46, x1 = 548, y0 = 10, y1 = 150, X = j => x0 + (j - .5) * (x1 - x0) / 25, Y = v => y0 + (12 - v) / 12 * (y1 - y0);
  let s = `<svg class="ch" viewBox="0 0 640 182" role="img" aria-label="Carte des étendues, jours 1 à 25">`;
  for (let g = 0; g <= 12; g += 3) s += `<line class="grid" x1="${x0}" x2="${x1}" y1="${Y(g)}" y2="${Y(g)}"/><text x="${x0 - 8}" y="${Y(g) + 4}" text-anchor="end">${g}</text>`;
  for (let j = 1; j <= 25; j++) s += `<text x="${X(j)}" y="${y1 + 16}" text-anchor="middle" style="font-size:10.5px">${j}</text>`;
  const sep = x0 + 20 * (x1 - x0) / 25; s += `<line class="ref" x1="${sep}" x2="${sep}" y1="${y0}" y2="${y1}" style="stroke-dasharray:3 3"/>`;
  [[LIM.LSCr, 'LSC', 'ref'], [LIM.Rb, 'R̄', 'axis'], [0, 'LIC', 'axis']].forEach(([v, t, c]) => s += `<line class="${c}" x1="${x0}" x2="${x1}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${x1 + 8}" y="${Y(v) + 4}">${t} ${fmt(v, t === 'LIC' ? 0 : 2)}</text>`);
  s += `<polyline class="l-apm" points="${CC.map(c => `${X(c.jour)},${Y(c.R)}`).join(' ')}" style="stroke-width:2"/>`;
  CC.forEach(c => s += `<circle class="f-apm" cx="${X(c.jour)}" cy="${Y(c.R)}" r="3.5"/>`);
  return s + '</svg>';
}
