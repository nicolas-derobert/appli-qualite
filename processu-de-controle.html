<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processus de Contrôle - QualiFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- ICON SYSTEM ---
        const LucideIcon = ({ name, size = 24, className = "", ...props }) => {
            const [svgContent, setSvgContent] = useState('');
            
            useEffect(() => {
                if (window.lucide && window.lucide.icons && window.lucide.icons[name]) {
                    const icon = window.lucide.icons[name];
                    const elem = window.lucide.createElement(icon);
                    elem.setAttribute('width', size);
                    elem.setAttribute('height', size);
                    if(className) elem.setAttribute('class', className);
                    if(props.strokeWidth) elem.setAttribute('stroke-width', props.strokeWidth);
                    setSvgContent(elem.outerHTML);
                }
            }, [name, size, className, props.strokeWidth]);

            if (!svgContent) return <span style={{width: size, height: size, display: 'inline-block'}} />;
            return <span dangerouslySetInnerHTML={{ __html: svgContent }} style={{ display: 'inline-flex' }} />;
        };

        const iconNames = [
          "ClipboardCheck", "Package", "AlertTriangle", "CheckCircle", "XCircle", "Search", "Plus", "User", "Settings", 
          "ArrowRight", "Save", "Trash2", "Archive", "RefreshCw", "Printer", "MapPin", "Factory", "Target", "Box", 
          "ArrowRightCircle", "Activity", "ShieldCheck", "Zap", "CheckSquare", "Sliders", "BookOpen", "Microscope", 
          "FileSpreadsheet", "Users", "Clock", "Briefcase", "Eye", "ArrowLeft", "ChevronRight"
        ];
        
        const Icons = {};
        iconNames.forEach(name => {
            Icons[name] = (props) => <LucideIcon name={name} {...props} />;
        });
        
        const { 
          ClipboardCheck, Package, AlertTriangle, CheckCircle, XCircle, Search, Plus, User, Settings, 
          ArrowRight, Save, Trash2, Archive, RefreshCw, Printer, MapPin, Factory, Target, Box, 
          ArrowRightCircle, Activity, ShieldCheck, Zap, CheckSquare, Sliders, BookOpen, Microscope, 
          FileSpreadsheet, Users, Clock, Briefcase, Eye, ArrowLeft, ChevronRight 
        } = Icons;

        // --- CONFIGURATION & DONNÉES PÉDAGOGIQUES ---

        const PRODUCTS = [
          { id: 'p1', name: 'Vis H45 Acier Trempé', ref: 'VIS-H45', tolerance: '±0.1mm', nqa: 2, sampleSize: 10 },
          { id: 'p2', name: 'Boîtier Plastique ABS', ref: 'BOX-ABS-01', tolerance: 'Visuel', nqa: 0, sampleSize: 5 },
          { id: 'p3', name: 'Connecteur 12 Pins', ref: 'CON-12P', tolerance: 'Continuité', nqa: 1, sampleSize: 20 },
        ];

        // Configuration des situations stratégiques avec fiches détaillées
        const CONTEXTS = {
          RECEIPT: {
            id: 'RECEIPT',
            label: 'Réception Marchandise',
            shortLabel: 'Réception',
            semanticColor: 'text-red-600', 
            stage: 'Entrants',
            icon: Box,
            definition: "Le filtre initial empêchant l'entrée de non-conformités externes.",
            stakes: "Protéger l'outil de production et éviter d'ajouter de la valeur ajoutée sur une matière défectueuse.",
            detailedActivities: [
              {
                title: "Contrôle Documentaire & Administratif",
                icon: FileSpreadsheet,
                definition: "Vérification de la concordance entre la commande, le bon de livraison et les certificats matière.",
                method: "Comparaison visuelle des références, quantités et indices de révision.",
                example: "Exemple : Réception d'acier 316L. Le contrôleur vérifie que le certificat matière 3.1 correspond bien au numéro de coulée gravé sur les barres d'acier reçues avant de les stocker."
              },
              {
                title: "Contrôle par Échantillonnage (AQL)",
                icon: Microscope,
                definition: "Prélèvement statistique selon la norme ISO 2859-1 pour valider le lot sans tout contrôler.",
                method: "Utilisation des tables AQL (Niveau II, NQA 1.0 par exemple).",
                example: "Exemple : Sur une palette de 5000 connecteurs, prélèvement de 200 pièces. Si plus de 3 pièces sont défectueuses, la palette entière est refusée et renvoyée au fournisseur."
              }
            ]
          },
          PRODUCTION: {
            id: 'PRODUCTION',
            label: 'En cours de production',
            shortLabel: 'Production',
            semanticColor: 'text-blue-600',
            stage: 'Transformation',
            icon: Activity,
            definition: "Surveillance active pour détecter les dérives avant qu'elles ne deviennent critiques.",
            stakes: "Pilotage du processus et réduction des coûts de non-qualité interne.",
            detailedActivities: [
              {
                title: "Autocontrôle par l'Opérateur",
                icon: User,
                definition: "Contrôle réalisé directement par la personne qui fabrique, à une fréquence définie.",
                method: "L'opérateur dispose d'une gamme d'autocontrôle, d'outils (pied à coulisse, gabarit) et valide sa propre production.",
                example: "Exemple : Sur une presse à injecter, l'opérateur vérifie visuellement l'aspect (brûlures, bavures) de 5 pièces toutes les heures et note 'OK' sur la fiche suiveuse au pied de la machine."
              },
              {
                title: "SPC (Maîtrise Statistique des Procédés)",
                icon: Activity,
                definition: "Outil préventif basé sur des statistiques pour surveiller la stabilité d'un procédé.",
                method: "Relevé de mesures (cotes) et report sur une carte de contrôle (Moyenne / Étendue). Analyse des dérives (7 points consécutifs, hors limites...).",
                example: "Exemple : Usinage d'un axe Ø10h7. L'opérateur mesure 5 pièces toutes les 2h. Le logiciel SPC alerte si la moyenne tend vers la limite supérieure (usure outil), permettant de changer l'outil AVANT de produire des pièces mauvaises."
              },
              {
                title: "Contrôle Volant (Audit Patrouille)",
                icon: Clock,
                definition: "Vérification aléatoire ou planifiée réalisée par le service Qualité sur le poste de travail.",
                method: "Audit de respect des standards : Le plan est-il le bon ? L'opérateur respecte-t-il l'autocontrôle ? Les moyens de mesure sont-ils étalonnés ?",
                example: "Exemple : Le technicien qualité passe à 10h30 sur la ligne d'assemblage. Il prend 3 produits au hasard dans le bac 'Bon' pour vérifier qu'aucune non-conformité n'a échappé à la vigilance de l'équipe."
              }
            ]
          },
          END_SERIES: {
            id: 'END_SERIES',
            label: 'En fin de série',
            shortLabel: 'Fin Série',
            semanticColor: 'text-emerald-600',
            stage: 'Validation',
            icon: ShieldCheck,
            definition: "Validation que le process est resté conforme jusqu'à la dernière pièce.",
            stakes: "Sécuriser le lot produit et libérer la ligne pour la série suivante.",
            detailedActivities: [
              {
                title: "Validation Dernière Pièce",
                icon: CheckCircle,
                definition: "Contrôle complet de la toute dernière pièce produite avant démontage.",
                method: "Comparaison avec la pièce type. Si la dernière est bonne, on suppose que la dérive n'a pas eu lieu.",
                example: "Exemple : En emboutissage, on garde la dernière pièce pour vérifier que le poinçon ne s'est pas cassé en cours de route. Si la dernière est OK, le lot est libéré."
              },
              {
                title: "Sécurisation & Identification",
                icon: Package,
                definition: "Vérification du conditionnement et de l'identification avant transfert.",
                method: "Contrôle des étiquettes (Quantité, Référence, Indice) et de l'état des bacs.",
                example: "Exemple : L'opérateur logistique vérifie que les 500 pièces sont bien dans un bac propre, que l'étiquette code-barre est lisible et correspond au bon de travail avant de flasher l'entrée en stock."
              }
            ]
          },
          FINAL_STOCK: {
            id: 'FINAL_STOCK',
            label: 'Fin de production / Final',
            shortLabel: 'Final / Stock',
            semanticColor: 'text-orange-600',
            stage: 'Sortants',
            icon: Package,
            definition: "L'ultime vérification avant l'expédition au client (Firewall Sortie).",
            stakes: "Protéger le client et l'image de marque de l'entreprise.",
            detailedActivities: [
              {
                title: "Contrôle Aspect & Finition",
                icon: Eye,
                definition: "Simulation de l'expérience client au déballage.",
                method: "Contrôle visuel à l'œil nu, sous lumière normalisée, à distance de bras.",
                example: "Exemple : Pour un boîtier électronique grand public, le contrôleur final vérifie l'absence de rayures, la qualité de la sérigraphie du logo et la présence des patins antidérapants."
              },
              {
                title: "Mur Qualité (Firewall)",
                icon: ShieldCheck,
                definition: "Contrôle renforcé temporaire suite à une plainte client.",
                method: "100% des pièces sont revérifiées sur un point spécifique critique.",
                example: "Exemple : Suite à une réclamation client sur des vis manquantes, une personne est dédiée en fin de ligne pour vérifier la présence des 4 vis sur 100% des colis pendant 1 semaine."
              }
            ]
          }
        };

        // --- COMPOSANTS UI GÉNÉRIQUES ---

        const Card = ({ children, className = '' }) => (
          <div className={`bg-[#ffffff] rounded-xl shadow-sm border border-[#e0e0e0] ${className}`}>
            {children}
          </div>
        );

        const Button = ({ children, onClick, variant = 'primary', disabled = false, size = 'md', icon: Icon, className = '' }) => {
          const baseStyle = "flex items-center justify-center rounded-lg font-medium transition-all focus:outline-none focus:ring-2 focus:ring-offset-1 disabled:opacity-50 disabled:cursor-not-allowed";
          
          const sizeStyles = {
            sm: "px-3 py-1.5 text-xs",
            md: "px-5 py-2.5 text-sm"
          };

          const variants = {
            primary: "bg-[#1a1a1a] text-white hover:bg-[#cfa346] hover:text-[#1a1a1a] focus:ring-[#1a1a1a]",
            secondary: "bg-white text-[#2d3436] border border-[#e0e0e0] hover:border-[#cfa346] hover:text-[#cfa346] focus:ring-[#cfa346]",
            ghost: "bg-transparent text-[#2d3436] hover:bg-[#f8f9fa] hover:text-[#cfa346]",
          };
          
          return (
            <button onClick={onClick} disabled={disabled} className={`${baseStyle} ${sizeStyles[size]} ${variants[variant]} ${className}`}>
              {Icon && <Icon size={size === 'sm' ? 16 : 18} className={children ? "mr-2" : ""} />}
              {children}
            </button>
          );
        };

        // --- LOGIQUE PRINCIPALE (APP) ---

        function App() {
          const [activeTab, setActiveTab] = useState('DASHBOARD'); 
          const [initialContext, setInitialContext] = useState(null);

          const handleContextSelect = (contextKey) => {
            setInitialContext(contextKey);
            setActiveTab('GUIDE'); 
          };

          const renderContent = () => {
            if (activeTab === 'GUIDE') {
              return (
                <ContextGuide 
                  onBack={() => setActiveTab('DASHBOARD')} 
                  contextKey={initialContext} 
                />
              );
            }
            return <Dashboard onSelect={handleContextSelect} />;
          };

          return (
            <div className="min-h-screen bg-[#f8f9fa] text-[#2d3436] font-sans selection:bg-[#f4e8cb] selection:text-[#856404]">
              {/* HEADER PREMIUM */}
              <header className="bg-[#1a1a1a] border-b border-[#cfa346] sticky top-0 z-20 shadow-lg">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                  <div className="flex items-center space-x-6">
                    <a href="index.html" className="text-white hover:text-[#cfa346] transition-colors" title="Retour à l'accueil">
                      <ArrowLeft size={24} />
                    </a>
                    <div className="flex items-center space-x-3 cursor-pointer group" onClick={() => setActiveTab('DASHBOARD')}>
                      <div className="bg-[#cfa346] p-2 rounded-lg text-[#1a1a1a] transition-transform transform group-hover:scale-105 shadow-[0_0_10px_rgba(207,163,70,0.3)]">
                        <ClipboardCheck size={24} strokeWidth={2.5} />
                      </div>
                      <div>
                        <h1 className="text-xl font-bold text-white tracking-tight leading-none">QualiFlow</h1>
                        <span className="text-[10px] font-bold text-[#cfa346] uppercase tracking-widest">Excellence & Contrôle</span>
                      </div>
                    </div>
                  </div>
                  
                  <div className="hidden md:flex items-center text-xs font-medium text-[#e0e0e0] opacity-80">
                     <span className="bg-[#2d3436] px-3 py-1 rounded-full border border-[#444]">Module Formation V2.0</span>
                  </div>
                </div>
              </header>

              <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
                {renderContent()}
              </main>
            </div>
          );
        }

        // --- VUE 1 : DASHBOARD SIPOC ---

        function Dashboard({ onSelect }) {
          const [hoveredContext, setHoveredContext] = useState(null);
          const displayContext = CONTEXTS[hoveredContext] || null;

          return (
            <div className="fade-in">
              <div className="text-center mb-16 space-y-2">
                <h2 className="text-3xl font-extrabold text-[#1a1a1a]">Cartographie des Contrôles (SIPOC)</h2>
                <p className="text-[#2d3436] opacity-70 text-lg max-w-2xl mx-auto">
                  Explorez le processus de production pour découvrir les points de contrôle clés et les standards associés.
                </p>
                <div className="w-24 h-1 bg-[#cfa346] mx-auto rounded mt-4"></div>
              </div>

              <div className="relative max-w-6xl mx-auto mb-16 px-4">
                {/* Ligne de flux */}
                <div className="absolute top-1/2 left-0 w-full h-1 bg-[#e0e0e0] -translate-y-1/2 rounded-full hidden md:block z-0"></div>
                
                <div className="grid grid-cols-1 md:grid-cols-5 gap-6 relative z-10">
                  
                  {/* Supplier */}
                  <div className="flex flex-col items-center justify-center p-6 bg-[#f8f9fa] rounded-xl border border-[#e0e0e0] border-dashed opacity-60">
                      <Factory size={36} className="text-[#2d3436] mb-3"/>
                      <div className="font-bold text-[#2d3436] uppercase tracking-widest text-xs">Fournisseur</div>
                  </div>

                  {/* INPUTS (Receipt) */}
                  <div 
                    onClick={() => onSelect('RECEIPT')}
                    onMouseEnter={() => setHoveredContext('RECEIPT')}
                    onMouseLeave={() => setHoveredContext(null)}
                    className="group cursor-pointer relative"
                  >
                      <div className="bg-white p-6 rounded-xl shadow-sm border border-[#e0e0e0] group-hover:border-[#cfa346] group-hover:shadow-[0_4px_20px_rgba(207,163,70,0.15)] transition-all duration-300 h-full flex flex-col items-center justify-center transform group-hover:-translate-y-1">
                          <div className="absolute -top-3 bg-[#1a1a1a] text-white px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider shadow-sm">Entrants</div>
                          <div className={`p-4 rounded-full bg-[#f8f9fa] mb-4 group-hover:bg-[#f4e8cb] transition-colors`}>
                            <Box size={28} className="text-[#2d3436]" />
                          </div>
                          <div className="font-bold text-[#1a1a1a] text-center">Réception</div>
                          <div className="mt-4 opacity-0 group-hover:opacity-100 transition-opacity translate-y-2 group-hover:translate-y-0 text-[#cfa346]">
                            <ChevronRight size={20} />
                          </div>
                      </div>
                  </div>

                  {/* PROCESS */}
                  <div className="relative flex flex-col gap-4">
                       {/* Container Processus */}
                       <div className="absolute inset-0 bg-[#f8f9fa] rounded-xl border border-[#e0e0e0] -z-10 translate-x-2 translate-y-2"></div>
                       <div className="bg-white rounded-xl border border-[#e0e0e0] p-4 h-full flex flex-col justify-between items-center shadow-sm relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-full h-1 bg-[#1a1a1a]"></div>
                            <div className="text-[10px] font-bold text-[#2d3436] uppercase tracking-widest mb-3 w-full text-center border-b border-[#f8f9fa] pb-2 opacity-60">Processus de production</div>
                            
                            {/* PRODUCTION STEP */}
                            <div onClick={() => onSelect('PRODUCTION')} onMouseEnter={() => setHoveredContext('PRODUCTION')} onMouseLeave={() => setHoveredContext(null)}
                              className="w-full bg-[#f8f9fa] hover:bg-[#f4e8cb] border border-[#e0e0e0] hover:border-[#cfa346] rounded-lg p-3 mb-2 cursor-pointer transition-all flex items-center gap-3 group">
                                <Activity size={18} className="text-[#2d3436] group-hover:text-[#856404]"/>
                                <div className="text-xs font-bold text-[#2d3436] group-hover:text-[#856404]">En Cours</div>
                            </div>

                            {/* END SERIES STEP */}
                            <div onClick={() => onSelect('END_SERIES')} onMouseEnter={() => setHoveredContext('END_SERIES')} onMouseLeave={() => setHoveredContext(null)}
                              className="w-full bg-[#f8f9fa] hover:bg-[#f4e8cb] border border-[#e0e0e0] hover:border-[#cfa346] rounded-lg p-3 cursor-pointer transition-all flex items-center gap-3 group">
                                <ShieldCheck size={18} className="text-[#2d3436] group-hover:text-[#856404]"/>
                                <div className="text-xs font-bold text-[#2d3436] group-hover:text-[#856404]">Fin de Série</div>
                            </div>
                       </div>
                  </div>

                  {/* OUTPUTS (Final) */}
                  <div onClick={() => onSelect('FINAL_STOCK')} onMouseEnter={() => setHoveredContext('FINAL_STOCK')} onMouseLeave={() => setHoveredContext(null)}
                    className="group cursor-pointer relative">
                      <div className="bg-white p-6 rounded-xl shadow-sm border border-[#e0e0e0] group-hover:border-[#cfa346] group-hover:shadow-[0_4px_20px_rgba(207,163,70,0.15)] transition-all duration-300 h-full flex flex-col items-center justify-center transform group-hover:-translate-y-1">
                          <div className="absolute -top-3 bg-[#1a1a1a] text-white px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider shadow-sm">Sortants</div>
                          <div className={`p-4 rounded-full bg-[#f8f9fa] mb-4 group-hover:bg-[#f4e8cb] transition-colors`}>
                            <Package size={28} className="text-[#2d3436]" />
                          </div>
                          <div className="font-bold text-[#1a1a1a] text-center">Stock / Final</div>
                          <div className="mt-4 opacity-0 group-hover:opacity-100 transition-opacity translate-y-2 group-hover:translate-y-0 text-[#cfa346]">
                            <ChevronRight size={20} />
                          </div>
                      </div>
                  </div>

                  {/* Customer */}
                  <div className="flex flex-col items-center justify-center p-6 bg-[#f8f9fa] rounded-xl border border-[#e0e0e0] border-dashed opacity-60">
                      <Users size={36} className="text-[#2d3436] mb-3"/>
                      <div className="font-bold text-[#2d3436] uppercase tracking-widest text-xs">Client</div>
                  </div>
                </div>
              </div>

              {/* ZONE D'INFO DYNAMIQUE */}
              <div className="max-w-4xl mx-auto px-4 h-36">
                 {displayContext ? (
                   <div className="fade-in relative overflow-hidden rounded-xl border border-[#cfa346] bg-white p-6 flex items-center gap-6 shadow-[0_10px_30px_rgba(0,0,0,0.05)] transition-all duration-300">
                       {/* Accent bar left */}
                       <div className="absolute left-0 top-0 bottom-0 w-1 bg-[#cfa346]"></div>
                       
                       <div className="hidden sm:flex p-4 rounded-full bg-[#f4e8cb] text-[#856404] shrink-0">
                          <displayContext.icon size={32} />
                       </div>
                       <div className="flex-1">
                          <h4 className="text-xl font-bold text-[#1a1a1a] mb-2">{displayContext.label}</h4>
                          <div className="text-[#2d3436] text-sm mb-3 opacity-90">{displayContext.stakes}</div>
                          <div className="flex items-center text-xs font-medium text-[#cfa346]">
                             <ArrowRightCircle size={14} className="mr-1" />
                             {displayContext.detailedActivities.length} Fiches disponibles
                          </div>
                       </div>
                       <div className="flex items-center pl-6 border-l border-[#e0e0e0]">
                          <Button size="md" onClick={() => onSelect(displayContext.id)} icon={BookOpen} className="shadow-lg">
                            Consulter
                          </Button>
                       </div>
                   </div>
                 ) : (
                   <div className="h-full flex flex-col items-center justify-center text-[#e0e0e0] border-2 border-dashed border-[#e0e0e0] rounded-xl bg-[#f8f9fa]">
                      <Zap size={32} className="mb-2 opacity-50 text-[#2d3436]"/>
                      <p className="text-sm font-medium text-[#2d3436] opacity-60">Survolez une étape pour prévisualiser les contrôles</p>
                   </div>
                 )}
              </div>
            </div>
          );
        }

        // --- VUE 2 : GUIDE CONTEXTUEL & FICHES SAVOIR ---

        function ContextGuide({ onBack, contextKey }) {
          const context = CONTEXTS[contextKey || 'RECEIPT'];
          const [expandedActivity, setExpandedActivity] = useState(null);

          return (
            <div className="max-w-5xl mx-auto fade-in pb-12">
               {/* HEADER */}
               <div className="mb-10">
                  <button onClick={onBack} className="flex items-center text-[#2d3436] hover:text-[#cfa346] font-medium mb-6 transition-colors group">
                     <ArrowRight className="transform rotate-180 mr-2 group-hover:-translate-x-1 transition-transform" size={20} /> 
                     Retour à la Cartographie
                  </button>
                  
                  <div className="flex flex-col md:flex-row md:items-start gap-6">
                     <div className="bg-[#1a1a1a] p-4 rounded-2xl text-[#cfa346] shadow-lg shrink-0">
                        <context.icon size={40} strokeWidth={1.5} />
                     </div>
                     <div>
                        <div className="flex items-center gap-3 mb-2">
                           <h2 className="text-3xl font-extrabold text-[#1a1a1a] tracking-tight">{context.label}</h2>
                           <span className="bg-[#f4e8cb] text-[#856404] text-[10px] font-bold px-2 py-1 rounded uppercase tracking-wider border border-[#cfa346]">
                              {context.stage}
                           </span>
                        </div>
                        <p className="text-[#2d3436] text-lg font-light leading-relaxed max-w-3xl opacity-80 border-l-4 border-[#cfa346] pl-4 py-1">
                           {context.definition}
                        </p>
                     </div>
                  </div>
               </div>

               {/* ENJEUX PRINCIPAUX - style "Premium Card" */}
               <div className="bg-[#1a1a1a] p-8 rounded-2xl shadow-xl mb-12 flex flex-col md:flex-row items-center md:items-start gap-6 text-white relative overflow-hidden">
                  {/* Decorative background element */}
                  <div className="absolute top-0 right-0 -mt-10 -mr-10 w-40 h-40 bg-[#cfa346] rounded-full opacity-10 blur-3xl"></div>
                  
                  <div className="bg-[#cfa346] p-3 rounded-full text-[#1a1a1a] shrink-0 shadow-lg z-10">
                    <Target size={28} />
                  </div>
                  <div className="z-10 text-center md:text-left">
                    <h3 className="font-bold text-[#cfa346] uppercase tracking-widest text-sm mb-2">Enjeux Stratégiques</h3>
                    <p className="text-white text-xl leading-relaxed font-light">{context.stakes}</p>
                  </div>
               </div>

               {/* LISTE DES ACTIVITÉS / FICHES */}
               <div className="flex items-center gap-3 mb-8">
                  <div className="h-px bg-[#e0e0e0] flex-1"></div>
                  <h3 className="font-bold text-2xl text-[#1a1a1a] flex items-center gap-2">
                    <BookOpen className="text-[#cfa346]" />
                    Fiche d'identité du contrôle
                  </h3>
                  <div className="h-px bg-[#e0e0e0] flex-1"></div>
               </div>

               <div className="space-y-6">
                  {context.detailedActivities.map((act, idx) => {
                    const isExpanded = expandedActivity === idx;
                    return (
                      <div 
                        key={idx} 
                        className={`bg-white rounded-xl border transition-all duration-300 overflow-hidden ${isExpanded ? 'border-[#cfa346] shadow-[0_10px_40px_rgba(207,163,70,0.15)]' : 'border-[#e0e0e0] shadow-sm hover:border-[#cfa346] hover:shadow-md'}`}
                      >
                        {/* Header Carte (Cliquable) */}
                        <div 
                          onClick={() => setExpandedActivity(isExpanded ? null : idx)}
                          className="p-6 cursor-pointer flex items-center justify-between group"
                        >
                          <div className="flex items-center gap-6">
                             <div className={`w-16 h-16 rounded-2xl flex items-center justify-center text-white shadow-md transition-colors ${isExpanded ? 'bg-[#cfa346] text-[#1a1a1a]' : 'bg-[#1a1a1a] text-[#cfa346]'}`}>
                                <act.icon size={30} strokeWidth={1.5} />
                             </div>
                             <div>
                               <h4 className={`text-xl font-bold mb-1 ${isExpanded ? 'text-[#1a1a1a]' : 'text-[#2d3436]'}`}>{act.title}</h4>
                               <p className="text-[#2d3436] opacity-60 text-sm flex items-center gap-1 group-hover:text-[#cfa346] transition-colors">
                                  {isExpanded ? "Masquer les détails" : "Voir la fiche technique"}
                               </p>
                             </div>
                          </div>
                          <div className={`w-10 h-10 rounded-full flex items-center justify-center transition-all ${isExpanded ? 'bg-[#f4e8cb] text-[#856404] rotate-90' : 'bg-[#f8f9fa] text-[#e0e0e0] group-hover:text-[#cfa346]'}`}>
                            <ArrowRight size={20} />
                          </div>
                        </div>

                        {/* Corps Détail (Accordéon) */}
                        {isExpanded && (
                          <div className="px-8 pb-10 pt-2 border-t border-[#f4e8cb] bg-[#fcfbf8]">
                             <div className="grid grid-cols-1 md:grid-cols-2 gap-10">
                                {/* Définition & Méthode */}
                                <div className="space-y-8">
                                   <div>
                                      <h5 className="flex items-center gap-2 font-bold text-[#1a1a1a] text-sm uppercase tracking-wider mb-3">
                                        <Briefcase size={18} className="text-[#cfa346]"/> Définition
                                      </h5>
                                      <p className="text-[#2d3436] leading-relaxed text-justify">{act.definition}</p>
                                   </div>
                                   <div>
                                      <h5 className="flex items-center gap-2 font-bold text-[#1a1a1a] text-sm uppercase tracking-wider mb-3">
                                        <Settings size={18} className="text-[#cfa346]"/> Méthode / Outils
                                      </h5>
                                      <p className="text-[#2d3436] leading-relaxed text-justify">{act.method}</p>
                                   </div>
                                </div>

                                {/* Exemple Réaliste (Highlight) */}
                                <div className="bg-[#ffffff] p-6 rounded-xl border-l-4 border-[#cfa346] shadow-sm relative">
                                   <div className="absolute top-4 right-4 opacity-10">
                                      <Factory size={60} />
                                   </div>
                                   <h5 className="flex items-center gap-2 font-bold text-[#856404] text-sm uppercase tracking-wider mb-4">
                                     Sur le terrain
                                   </h5>
                                   <p className="text-[#2d3436] italic leading-relaxed text-lg font-serif">
                                     "{act.example.replace('Exemple :', '')}"
                                   </p>
                                </div>
                             </div>
                          </div>
                        )}
                      </div>
                    );
                  })}
               </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
